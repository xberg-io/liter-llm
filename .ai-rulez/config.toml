version = "5.0"
default_layers = ["plugins"]
name = "liter-llm"
description = "Multi-language LLM library with Rust core and polyglot bindings (Python, TypeScript, Ruby, PHP, Elixir, Go, Java, C#, WASM)"
gitignore = true

presets = ["claude", "codex", "opencode", "pi", "hermes", "gemini", "copilot"]

compact = true
builtins = [
  "!git-workflow",
  "rust",
  "python",
  "typescript",
  "ruby",
  "php",
  "elixir",
  "go",
  "java",
  "csharp",
  "pyo3",
  "napi-rs",
  "default-commands",
]

[header]
style = "minimal"


[[includes]]
name = "xberg-core"
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "2011d3db223de5b1c8b35f602ec6f2d2a7b62bf8"
path = "modules/core"
merge_strategy = "local-override"

[[includes]]
name = "xberg-cicd"
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "2011d3db223de5b1c8b35f602ec6f2d2a7b62bf8"
path = "modules/cicd"
merge_strategy = "local-override"

[[installed_skills]]
name = "alef"
source = "https://github.com/xberg-io/alef.git"

ref = "613e2b06975b1d3a0d776ca141dec7b540e9ed74"
[[mcp_servers]]
name = "ai-rulez"
description = "AI-Rulez MCP server for configuration management"
command = "ai-rulez"
args = ["mcp"]

[[mcp_servers]]
name = "playwright"
description = "Playwright browser automation for E2E testing and docs verification"
command = "npx"
args = ["-y", "@playwright/mcp@0.0.83"]

[defaults]
effort = "medium"

[mcp]
self_server_command = ["ai-rulez", "mcp"]

[lock]
include_outputs = false

[lint]
allow_overrides = ["claude:mcp", "python-conventions"]

# Goldziher/ai-rulez#485: ai-rulez reports generated skill copies as duplicates. ~keep
[[lint.ignore_rules]]
rules = ["AR701"]
paths = [
  ".claude/skills/*/SKILL.md",
  ".codex/skills/*/SKILL.md",
  "plugin/.cursor-plugin/skills/*/SKILL.md",
  "plugin/.hermes/package/src/liter_llm_hermes_plugin/skills/*/SKILL.md",
  "plugin/.hermes/plugins/liter-llm/skills/*/SKILL.md",
  "plugin/.opencode/skills/*/SKILL.md",
  "plugin/.pi/skills/*/SKILL.md",
  "plugin/skills/*/SKILL.md",
  "skills/*/SKILL.md",
]
reason = "The generated harness and plugin copies repeat the source skill descriptions and names. ai-rulez counts each copy as a duplicate."
