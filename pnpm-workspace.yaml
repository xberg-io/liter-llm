packages:
  - "crates/liter-llm-node"
  - "crates/liter-llm-node/npm/*"
  - "crates/liter-llm-wasm"
  - "e2e/node"
  - "e2e/wasm"
allowBuilds:
  esbuild: true
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - "@xberg-io/*"

linkWorkspacePackages: true
sharedWorkspaceLockfile: true
autoInstallPeers: true
hoist: true
overrides:
  vite: ">=8.2.1 <9"
  "postcss@>=8.0.0 <8.5.23": "8.5.23"
  "nanoid@>=3.0.0 <3.3.18": "3.3.18"
  "esbuild@>=0.27.0 <0.28.1": "0.28.1"
