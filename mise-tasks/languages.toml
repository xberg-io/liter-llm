run = "bundle exec rake compile"

["ruby:test"]
description = "Run Ruby tests"
dir = "packages/ruby"
run = "bundle exec rspec"

["ruby:format"]
description = "Format Ruby code"
dir = "packages/ruby"
run = "bundle exec rubocop --config .rubocop.yml --autocorrect-all ."

["ruby:format:check"]
description = "Check Ruby formatting (CI)"
dir = "packages/ruby"
run = "bundle exec rubocop --config .rubocop.yml --format simple ."

["ruby:lint"]
description = "Lint Ruby code"
dir = "packages/ruby"
run = "bundle exec rubocop --config .rubocop.yml ."

["ruby:lint:check"]
description = "Check Ruby linting without modifications (CI)"
run = [{ task = "ruby:format:check" }]

["ruby:typecheck"]
description = "Run Steep type checking"
dir = "packages/ruby"
run = "bundle exec steep check"

["ruby:rbs-validate"]
description = "Validate RBS type signatures"
dir = "packages/ruby"
run = "bundle exec rbs validate"

["ruby:clean"]
description = "Clean Ruby build artifacts"
dir = "packages/ruby"
run = "rm -rf tmp lib/liter_llm/liter_llm_ruby.* vendor/liter-llm-core vendor/Cargo.toml"

["ruby:e2e:generate"]
description = "Generate Ruby E2E tests from fixtures"
run = "alef e2e generate --lang ruby"

["ruby:e2e:test"]
description = "Run Ruby E2E tests using Alef-configured test commands"
run = "alef test --lang ruby --e2e"

# ---- Elixir ------------------------------------------------------------------------------------

["elixir:deps"]
description = "Install Elixir dependencies"
dir = "packages/elixir"
run = "mix deps.get"

["elixir:build"]
description = "Compile Elixir project (includes Rustler NIF)"
dir = "packages/elixir"
env.LITER_LLM_BUILD = "1"
run = "mix compile"

["elixir:test"]
description = "Run Elixir tests"
dir = "packages/elixir"
env = { MIX_ENV = "test", LITER_LLM_BUILD = "1" }
run = "mix test"

["elixir:format"]
description = "Format Elixir code"
dir = "packages/elixir"
run = "mix format"

["elixir:format:check"]
description = "Check Elixir formatting (CI)"
dir = "packages/elixir"
run = "mix format --check-formatted"

["elixir:lint"]
description = "Lint Elixir code (credo, requires NIF built first)"
dir = "packages/elixir"
run = "mix credo --strict"

["elixir:lint:check"]
description = "Check Elixir linting without modifications (CI)"
run = [{ task = "elixir:lint" }]

["elixir:update"]
description = "Update Elixir dependencies to latest versions"
dir = "packages/elixir"
run = [
  "echo 'Note - Elixir requires manual mix.exs edits for major version updates'",
  "mix hex.outdated || true",
  "mix deps.update --all",
  "mix hex.outdated || true",
]

["elixir:clean"]
description = "Clean Elixir build artifacts"
dir = "packages/elixir"
run = "mix clean"

["elixir:e2e:generate"]
description = "Generate Elixir E2E tests from fixtures"
run = "alef e2e generate --lang elixir"

["elixir:e2e:test"]
description = "Run Elixir E2E tests using Alef-configured test commands"
run = "alef test --lang elixir --e2e"

# ---- C and Swift -------------------------------------------------------------------------------

["c:build:ffi"]
description = "Build FFI library for C tests"
run = "cargo build -p liter-llm-ffi --release"

["c:build"]
description = "Build FFI library (alias for build:ffi)"
run = [{ task = "c:build:ffi" }]

["c:test"]
description = "Build and run C E2E tests"
run = [{ task = "c:e2e:test" }]

["c:clean"]
description = "Clean C build artifacts"
dir = "e2e/c"
run = "rm -rf build"

["c:e2e:generate"]
description = "Generate C E2E tests from fixtures"
run = "alef e2e generate --lang c"

["c:e2e:build"]
description = "Build C E2E tests using Alef-configured test setup"
run = [{ task = "c:e2e:test" }]

["c:e2e:test"]
description = "Run C E2E tests using Alef-configured test commands"
run = "alef test --lang ffi --e2e"

# Task env stays on this task only; C and Ruby compilers must not inherit an iOS target. ~keep
["swift:build"]
description = "Build Swift native libraries for the declared minimum Apple OS versions"
env = { MACOSX_DEPLOYMENT_TARGET = "13.0", IPHONEOS_DEPLOYMENT_TARGET = "16.0" }
run = "cargo build --locked --release -p liter-llm-swift -p liter-llm-ffi"
