# Published-package test apps, included from mise.toml [task_config]. test_apps/ is generated by
# `alef e2e generate --registry` and runs against the currently-published version of each binding;
# every dir is rooted at {{config_root}}. ~keep

["test-apps:run"]
description = "Run alef test-apps for every registry-mode language + brew + homebrew"
run = "alef test-apps run"

["test-apps:regenerate:scaffold"]
description = "Regenerate alef test-app scaffolds for a single language (usage - mise run test-apps:regenerate:scaffold -- python)"
run = "alef test-apps generate"

["test-apps:regenerate"]
description = "Regenerate test_apps/ via alef and re-sync versions"
run = ["alef e2e generate --registry", "alef sync-versions"]

["test-apps:smoke"]
description = "Run all test_app smoke tests"
run = [
  { task = "test-apps:smoke:rust" },
  { task = "test-apps:smoke:python" },
  { task = "test-apps:smoke:node" },
  { task = "test-apps:smoke:wasm" },
  { task = "test-apps:smoke:ruby" },
  { task = "test-apps:smoke:go" },
  { task = "test-apps:smoke:java" },
  { task = "test-apps:smoke:elixir" },
  { task = "test-apps:smoke:php" },
  { task = "test-apps:smoke:csharp" },
  { task = "test-apps:smoke:c" },
  { task = "test-apps:smoke:dart" },
  { task = "test-apps:smoke:zig" },
  { task = "test-apps:smoke:kotlin_android" },
  { task = "test-apps:smoke:swift_e2e" },
  { task = "test-apps:smoke:homebrew" },
]

["test-apps:smoke:python"]
description = "Run Python test_app smoke test"
dir = "{{config_root}}/test_apps/python"
run = ["uv sync", "uv run pytest tests/test_smoke.py -v"]

["test-apps:smoke:node"]
description = "Run Node.js test_app smoke test"
dir = "{{config_root}}/test_apps/node"
run = [
  "pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0",
  "pnpm --config.minimumReleaseAge=0 exec vitest run tests/smoke.test.ts",
]

["test-apps:smoke:wasm"]
description = "Run WASM test_app smoke test"
dir = "{{config_root}}/test_apps/wasm"
run = [
  "pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0",
  "pnpm --config.minimumReleaseAge=0 exec vitest run tests/smoke.test.ts",
]

["test-apps:smoke:ruby"]
description = "Run Ruby test_app smoke test"
dir = "{{config_root}}/test_apps/ruby"
run = ["bundle install", "bundle exec rspec spec/smoke_spec.rb"]

["test-apps:smoke:java"]
description = "Run Java test_app smoke test"
dir = "{{config_root}}/test_apps/java"
run = "mvn test -Dtest=SmokeTest"

["test-apps:smoke:elixir"]
description = "Run Elixir test_app smoke test"
dir = "{{config_root}}/test_apps/elixir"
run = ["mix deps.get", "mix test test/smoke_test.exs"]

["test-apps:smoke:php"]
description = "Run PHP test_app smoke test"
dir = "{{config_root}}/test_apps/php"
run = ["bash install.sh", "composer install", "php -dextension=liter_llm vendor/bin/phpunit tests/SmokeTest.php"]

["test-apps:smoke:csharp"]
description = "Run C# test_app smoke test"
dir = "{{config_root}}/test_apps/csharp"
run = ["dotnet restore", "dotnet test --filter FullyQualifiedName~SmokeTests"]

["test-apps:smoke:c"]
description = "Run C test_app smoke test"
dir = "{{config_root}}/test_apps/c"
run = ["cd ../.. && cargo build -p liter-llm-ffi --release", "bash download_ffi.sh", "make smoke"]

["test-apps:smoke:dart"]
description = "Run Dart test_app smoke test"
dir = "{{config_root}}/test_apps/dart"
run = ["dart pub get", "dart test test/smoke_test.dart"]

["test-apps:smoke:zig"]
description = "Run Zig test_app smoke test"
dir = "{{config_root}}/test_apps/zig"
run = [{ task = "test-apps:prepare:zig" }, "zig build test"]

["test-apps:smoke:kotlin_android"]
description = "Run Kotlin/Android test_app smoke test (host JVM)"
run = [{ task = "test-apps:kotlin_android:gradle smoke" }]

["test-apps:smoke:swift_e2e"]
description = "Run Swift test_app smoke test (binaryTarget artifact bundle)"
dir = "{{config_root}}/test_apps/swift_e2e"
run = ["bash download_swift_artifact.sh", "swift test"]

["test-apps:comprehensive"]
description = "Run all test_app comprehensive tests"
run = [
  { task = "test-apps:comprehensive:python" },
  { task = "test-apps:comprehensive:node" },
  { task = "test-apps:comprehensive:wasm" },
  { task = "test-apps:comprehensive:ruby" },
  { task = "test-apps:comprehensive:go" },
  { task = "test-apps:comprehensive:java" },
  { task = "test-apps:comprehensive:csharp" },
  { task = "test-apps:comprehensive:php" },
  { task = "test-apps:comprehensive:elixir" },
  { task = "test-apps:comprehensive:c" },
  { task = "test-apps:comprehensive:dart" },
  { task = "test-apps:comprehensive:zig" },
  { task = "test-apps:comprehensive:kotlin_android" },
  { task = "test-apps:comprehensive:swift_e2e" },
]

["test-apps:comprehensive:python"]
description = "Run Python test_app comprehensive tests"
dir = "{{config_root}}/test_apps/python"
run = ["uv sync", "uv run pytest tests/ -v"]

["test-apps:comprehensive:node"]
description = "Run Node.js test_app comprehensive tests"
dir = "{{config_root}}/test_apps/node"
run = [
