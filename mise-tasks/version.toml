# Version sync and bump tasks, included from mise.toml [task_config]. The alef bodies come from
# xberg-io/toolchains at the toolchains.toml baseline. ~keep

["alef:regenerate"]
description = "Regenerate every alef output that carries the version"
hide = true
file = "https://raw.githubusercontent.com/xberg-io/toolchains/v1.5.1/tasks/alef/regenerate.sh"

["alef:verify:strict"]
description = "Run alef verify and fail on drifted frozen paths too"
hide = true
file = "https://raw.githubusercontent.com/xberg-io/toolchains/v1.5.1/tasks/alef/verify-strict.sh"

["version:sync"]
description = "Synchronize version across all package manifests"
run = [
  "alef sync-versions",
  { task = "alef:regenerate" },
  # Sync the coding-agent plugin: pin plugin/.ai-rulez/config.plugins.toml [plugin].version
  # to core, then regenerate the per-runtime bundles under plugin/ from it. ~keep
  "python3 scripts/sync_plugin_version.py",
  "python3 scripts/ci/check_consumer_versions.py --sync",
  { task = "plugin:generate" },
  # ~keep The plugin skill files carry the version, so the ai-rulez lock digests change
  # with every bump. Refresh the lock here so the bump and the lock land in one commit.
  "ai-rulez -C .ai-rulez lock",
  { task = "alef:verify:strict" },
]

["version:check"]
description = "Check if versions are synchronized (dry-run)"
run = ["python3 scripts/ci/check_consumer_versions.py", { task = "version:show" }]

["version:show"]
description = "Show current version from Cargo.toml"
file = "https://raw.githubusercontent.com/xberg-io/toolchains/v1.5.1/tasks/version/cargo.sh"

["version:bump:major"]
description = "Bump major version (X.0.0) and sync"
run = ["alef sync-versions --bump major", { task = "version:sync" }]

["version:bump:minor"]
description = "Bump minor version (0.X.0) and sync"
run = ["alef sync-versions --bump minor", { task = "version:sync" }]

["version:bump:patch"]
description = "Bump patch version (0.0.X) and sync"
run = ["alef sync-versions --bump patch", { task = "version:sync" }]
