[package]
name = "liter-llm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "CLI for liter-llm — start an OpenAI-compatible proxy server or MCP tool server."
keywords = ["llm", "proxy", "cli", "openai", "xberg"]

# ~keep cargo-binstall support: release assets embed the version and use a `liter-llm-`
# ~keep prefix, so pin the download URL and bin-dir explicitly.
# ~keep See https://github.com/cargo-bins/cargo-binstall/blob/main/SUPPORT.md
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/liter-llm-{ version }-{ target }{ archive-suffix }"
bin-dir = "liter-llm-{ version }-{ target }/{ bin }{ binary-ext }"

[[bin]]
name = "liter-llm"
path = "src/main.rs"

[features]
# ~keep The CLI owns subscriber install (libraries emit only). `otel` adds the OTLP
# ~keep export pipeline (SpanExporter + Sdk tracer/meter providers + tracing-opentelemetry
# ~keep layer), activated at runtime by `OTEL_EXPORTER_OTLP_ENDPOINT`.
otel = [
    "liter-llm-proxy/otel",
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]

# ~keep Off by default; etcd watch pulls transitive `protoc`/`prost-build`.
etcd-watch = ["liter-llm-proxy/etcd-watch"]

# ~keep If both allocator features are enabled, the allocator module emits a compile error.
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]

default = []

[dependencies]
arc-swap = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
liter-llm = { path = "../liter-llm", version = "2.0.1" }
liter-llm-proxy = { path = "../liter-llm-proxy", version = "2.0.1" }
mimalloc = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
rmcp = { workspace = true }
secrecy = { workspace = true }
tikv-jemallocator = { workspace = true, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
