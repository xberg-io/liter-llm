version: "3"

includes:
  _cfg:
    taskfile: .task/config/vars.yml
    internal: true
  _platforms:
    taskfile: .task/config/platforms.yml
    internal: true
  rust:
    taskfile: .task/languages/rust.yml
  python:
    taskfile: .task/languages/python.yml
  node:
    taskfile: .task/languages/node.yml
  go:
    taskfile: .task/languages/go.yml
  java:
    taskfile: .task/languages/java.yml
  elixir:
    taskfile: .task/languages/elixir.yml
  c:
    taskfile: .task/languages/c.yml
  ruby:
    taskfile: .task/languages/ruby.yml
  wasm:
    taskfile: .task/languages/wasm.yml
  php:
    taskfile: .task/languages/php.yml
  csharp:
    taskfile: .task/languages/csharp.yml
  swift:
    taskfile: .task/languages/swift.yml
  _build_wf:
    taskfile: .task/workflows/build.yml
    internal: true
  _test_wf:
    taskfile: .task/workflows/test.yml
    internal: true
  _lint_wf:
    taskfile: .task/workflows/lint.yml
    internal: true
  version:
    taskfile: .task/tools/version-sync.yml
  plugin:
    taskfile: .task/tools/plugin.yml
  tools:
    taskfile: .task/tools/general.yml
  test-apps:
    taskfile: .task/tools/test-apps.yml
  docs:
    taskfile: .task/tools/docs.yml
  local:
    taskfile: .task/workflows/local.yml
  e2e:
    taskfile: .task/workflows/e2e.yml

vars:
  PROJECT_ROOT:
    sh: pwd
  VERSION:
    sh: python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  setup:
    desc: "Install all dependencies and dev tools"
    cmds:
      - task: rust:install
      - alef setup
      - |
        # Track the newest poly rather than a pinned version, matching ci-lint.yaml,
        # which leaves `poly-version` unset. A pin here ages into a build with known
        # defects and silently diverges from what CI runs. ~keep
        #
        # poly ships on several channels and brew is only one of them, so this does not
        # force a channel — it upgrades the one it can and tells you when it cannot.
        # Failing on a non-brew poly would break every contributor who installed it with
        # `cargo install`, which is a supported channel. ~keep
        if ! command -v poly >/dev/null 2>&1; then
          brew install goldziher/tap/poly
        elif [ "$(command -v poly)" = "$(brew --prefix 2>/dev/null)/bin/poly" ]; then
          # `brew install` no-ops on an already-installed-but-outdated formula, so an
          # upgrade must be attempted explicitly or a stale poly survives untouched. ~keep
          brew upgrade goldziher/tap/poly 2>/dev/null || true
        else
          echo "poly $(poly --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1) from $(command -v poly) (not brew) — keep it current on that channel; CI always installs the newest release." >&2
        fi
      - poly hooks install

  setup:sdkman:
    desc: "Install and configure sdkman for JVM toolchain management (run separately if you need Java/Maven)"
    cmds:
      - task: _platforms:setup:sdkman

  ai-rulez:
    desc: Generate ai-rulez configuration files (CLAUDE.md, etc.)
    cmds:
      - task: tools:ai-rulez

  build:
    desc: Build core Rust library
    cmds:
      - task: rust:build

  build:all:
    desc: Build core libraries and ALL language bindings
    cmds:
      - task: rust:build
      - task: python:build
      # ~keep node:build runs `pnpm install` across the workspace, and e2e/wasm
      # depends on `file:../../crates/liter-llm-wasm/pkg/nodejs`. Only the nodejs
      # target emits that directory, so it must exist before pnpm resolves.
      - task: wasm:build:node
      - task: node:build
      - task: go:build
      - task: java:build
      - task: csharp:build
      - task: php:build
      # ~keep `setup` does not install per-language deps, so on a pristine tree
      # `mix compile` fails with every Hex dependency unavailable.
      - task: elixir:deps
      - task: elixir:build
      - task: ruby:build
      - task: wasm:build

  build:release:
    desc: Build in release mode (optimized)
    cmds:
      - task: rust:build:release

  test:
    desc: Run Rust unit and FFI tests
    cmds:
      - task: rust:test

  test:release-regressions:
    desc: Run lightweight release guard regression tests
    cmds:
      - python3 scripts/ci/check_consumer_versions.py
      - >-
        uv run --locked --only-group dev --python 3.14 python -m pytest -q
        scripts/ci/test_task_lint_coverage.py
        scripts/ci/test_kotlin_consumer_version.py
        scripts/ci/test_dart_consumer_version.py
        scripts/ci/test_consumer_versions.py
        scripts/ci/test_go_release_assets.py
        scripts/ci/test_swift_task_environment.py
        scripts/ci/test_homebrew_consumer_version.py
        scripts/ci/test_node_public_outputs.py
        scripts/ci/test_go_smoke_test_filter.py

  test:all:
    desc: Run ALL test suites across all languages
    cmds:
      - task: rust:test
      - task: go:test
      - task: java:test
      - task: csharp:test
      - task: elixir:test
      - task: test:scripts

  test:scripts:
    desc: "Run the Bats contract tests for the repo's own shell scripts"
    env:
      # Suites load the shared helpers with `bats_load_library xberg-bats`, which searches
      # BATS_LIB_PATH and nothing else. CI sets the same directory for the bats job, so a local
      # run and a CI run load identical bytes.
      BATS_LIB_PATH: "{{.ROOT_DIR}}/scripts/tests/lib"
    preconditions:
      - sh: command -v bats
        msg: "bats is required: brew install bats-core"
      - sh: test -f scripts/tests/lib/xberg-bats/load.bash
        msg: "shared Bats helpers are missing; run `task test:scripts:lib:sync`"
    cmds:
      - bats --recursive --print-output-on-failure scripts/tests/bats

  test:scripts:lib:sync:
    desc: "Refresh the vendored Bats helper library from xberg-io/actions"
    cmds:
      - scripts/task/sync-bats-lib.sh sync

  test:scripts:lib:check:
    desc: "Fail when the vendored Bats helper library has drifted from its pinned source"
    cmds:
      - scripts/task/sync-bats-lib.sh --check

  proxy:test:
    desc: Run all proxy tests (unit + integration)
    cmds:
      - cargo test -p liter-llm-proxy

  proxy:docker:build:
    desc: Build proxy Docker image for testing
    cmds:
      - docker build -f docker/Dockerfile -t liter-llm:test .

  proxy:docker:test:
    desc: Run Docker integration tests locally
    deps: [proxy:docker:build]
    cmds:
      - python3 scripts/ci/docker/test_docker.py --image liter-llm:test --port 14000

  proxy:schemathesis:
    desc: Run schemathesis API contract tests against proxy Docker image
    cmds:
      - docker build -f docker/Dockerfile -t liter-llm:schemathesis .
      - |
        container_id=$(docker run -d -p 4111:4000 \
          -e LITER_LLM_MASTER_KEY=sk-schema-test \
          liter-llm:schemathesis)
        sleep 3
        FAILED=0
        schemathesis run http://localhost:4111/openapi.json \
          --max-examples=10 \
          --request-timeout=30000 \
          --header "Authorization: Bearer sk-schema-test" \
          --checks status_code_conformance,response_schema_conformance,negative_data_rejection || FAILED=1
        docker stop "$container_id"
        exit $FAILED

  lint:
    desc: Run all linters via poly
    cmds:
      - poly lint .
      - task: lint:task-coverage

  lint:task-coverage:
    desc: Assert every Taskfile poly skips is skipped only for Go template syntax
    # poly cannot parse Taskfile YAML containing `{{ }}` and skips those files.
    # That is correct, but it means most of our task automation is linted by
    # nothing, and a NEW silently-skipped file is indistinguishable from one that
    # was checked and found clean. The script reads poly's `--format json` report
    # and asserts each skip's reason per file, so poly parsing more of the tree is
    # a pass and only a new kind of skip fails. ~keep
    cmds:
      - python3 scripts/ci/check_task_lint_coverage.py

  check:
    desc: Run all checks (lint + test)
    cmds:
      - task: lint
      - task: test

  format:
    desc: Format all code
    cmds:
      - poly fmt --fix .

  update:
    desc: Update all dependencies within current major versions
    cmds:
      - echo "Updating dependencies (within-major)..."
      - alef update
      - gau --update .
      - task: generate:catalog
      - echo "All dependencies updated"

  upgrade:
    desc: Upgrade all dependencies to latest versions (may cross major versions)
    cmds:
      - echo "Upgrading dependencies (latest)..."
      - alef update --latest
      - gau --update .
      - task: generate:catalog
      - echo "All dependencies upgraded"

  clean:
    desc: Clean all build artifacts
    cmds:
      - task: rust:clean
      - alef clean

  alef:extract:
    desc: Extract API surface from Rust source
    cmds:
      - alef extract

  alef:generate:
    desc: Fast regeneration of all alef-managed files (bindings, stubs, scaffolding, READMEs, e2e, test_apps, docs). Runs `alef all --clean` (formatting is always applied).
    cmds:
      # ~keep `alef all` never builds the per-language artifacts that a `compile`/`typecheck`
      # `docs.snippets.validation_level` needs (only `alef build` does), so leaving validation on
      # spawns a doomed toolchain per snippet and cannot pass by construction. Discovery, the
      # reference-page audit and gap detection still run. Use `task alef:snippets` after
      # `alef build` when you actually want validation.
      - alef all --clean --skip-compile --skip-snippet-validation

  alef:all:
    desc: Run full alef pipeline (extract + generate + stubs + scaffold + readme + docs + e2e)
    cmds:
      - alef all

  alef:verify:
    desc: Check bindings are up-to-date (CI)
    cmds:
      - alef verify --exit-code

  alef:snippets:
    desc: Validate documentation snippets (needs built artifacts; run after alef build)
    cmds:
      - mvn -B -q -f packages/java/pom.xml -DincludeScope=runtime dependency:copy-dependencies
      - task: alef:snippets:kotlin:prepare
      - alef snippets check

  alef:snippets:kotlin:prepare:
    desc: Build Android classes required by Kotlin snippet typechecking
    dir: packages/kotlin-android
    env:
      GRADLE_USER_HOME: .gradle
    cmds:
      - ./gradlew assembleDebug --no-daemon --max-workers=1

  generate:all:
    desc: Regenerate all generated code
    cmds:
      - alef all

  generate:docs:
    desc: Generate API reference documentation
    cmds:
      - alef docs

  generate:docs:check:
    desc: Validate API reference docs are up-to-date (CI)
    cmds:
      - alef verify --exit-code

  generate:readme:
    desc: Generate package READMEs
    cmds:
      - alef readme

  generate:readme:check:
    desc: Validate package READMEs are up-to-date (CI)
    cmds:
      - alef verify --exit-code

  generate:providers-doc:
    desc: Generate providers documentation from schemas/providers.json
    cmds:
      - uv run --no-sync python scripts/generate_providers_doc.py

  generate:providers-doc:check:
    desc: Validate providers documentation is up-to-date (CI)
    cmds:
      - uv run --no-sync python scripts/generate_providers_doc.py --validate

  generate:catalog:
    desc: Refresh schemas/catalog.json from models.dev (also runs as part of `task update`/`upgrade`)
    cmds:
      - cargo run -p liter-llm-catalog-gen --release --

  generate:catalog:check:
    desc: Validate catalog.json is up-to-date with models.dev (CI)
    cmds:
      - cargo run -p liter-llm-catalog-gen --release -- --validate

  test:e2e:
    desc: Generate and run e2e tests across all bindings (alias for e2e:verify:all)
    cmds:
      - task: e2e:verify:all

  e2e:generate:
    desc: Generate E2E tests for all languages from fixtures (alias for e2e:generate:all)
    cmds:
      - task: e2e:generate:all

  e2e:test:
    desc: Run E2E tests for all languages (alias for e2e:test:all)
    cmds:
      - task: e2e:test:all

  publish:validate:
    desc: "Validate publish manifests are consistent"
    cmds:
      - alef publish validate

  publish:prepare:
    desc: "Prepare packages for publishing (vendor deps, stage FFI)"
    cmds:
      - alef publish prepare

  publish:build:
    desc: "Build release artifacts for all languages"
    cmds:
      - alef publish build

  publish:package:
    desc: "Package built artifacts into distributable archives"
    cmds:
      - alef publish package -o dist/

  e2e:test:rust:
    desc: Run Rust E2E tests (alias for rust:e2e:test)
    cmds:
      - task: rust:e2e:test
