[build-system]
requires = ['hatchling>=1.27']
build-backend = 'hatchling.build'

[project]
name = 'liter-llm-hermes-plugin'
version = '2.3.0'
description = 'Universal LLM API client for 174 providers — chat, streaming, tools, embeddings, search, OCR, plus an OpenAI-compatible proxy and an MCP server.'
license = 'MIT'
requires-python = '>=3.11'
dependencies = ['mcp==1.28.1', 'PyYAML==6.0.3']
keywords = ['llm', 'openai', 'proxy', 'embeddings', 'mcp']

[project.readme]
content-type = 'text/markdown'
text = "# liter-llm Hermes plugin\n\nUniversal LLM API client for 174 providers — chat, streaming, tools, embeddings, search, OCR, plus an OpenAI-compatible proxy and an MCP server.\n\nInstall this package in the same Python environment as Hermes Agent:\n\n```sh\npython -m pip install liter-llm-hermes-plugin\n```\n\nEnable the plugin through Hermes Agent's plugin configuration. Available registrations depend on the plugin's authored Hermes adapter.\n"

[project.entry-points]
[project.entry-points.'hermes_agent.plugins']
liter-llm = 'liter_llm_hermes_plugin'

[project.urls]
Homepage = 'https://xberg.io'
Repository = 'https://github.com/xberg-io/liter-llm'

[tool]
[tool.hatch]
[tool.hatch.build]
[tool.hatch.build.targets]
[tool.hatch.build.targets.wheel]
packages = ['src/liter_llm_hermes_plugin']
