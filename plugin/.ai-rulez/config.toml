version = "5.0"
default_layers = ["plugins"]
name = "liter-llm"
description = "Universal LLM API client for 174 providers — chat, streaming, tools, embeddings, search, OCR, plus an OpenAI-compatible proxy and an MCP server."
# Pinned by `ai-rulez migrate v5`: the 4.x default. Remove this line to take the v5 default.
agents_md = false
# Pinned by `ai-rulez migrate v5`: the 4.x default. Remove this line to take the v5 default.
gitignore = true

[lint]
# The repository MCP reference intentionally keeps the Claude /mcp name. ~keep
allow_overrides = ["claude:mcp"]

# Goldziher/ai-rulez#485: ai-rulez reports generated skill copies as duplicates. ~keep
[[lint.ignore_rules]]
rules = ["AR701"]
paths = [".claude/skills/*/SKILL.md", ".codex/skills/*/SKILL.md"]
reason = "The generated harness and plugin copies repeat the source skill descriptions and names. ai-rulez counts each copy as a duplicate."

[[lint.ignore_rules]]
rules = ["AR701", "AR703"]
paths = [
  "plugin/.cursor-plugin/skills/*/SKILL.md",
  "plugin/.hermes/package/src/liter_llm_hermes_plugin/skills/*/SKILL.md",
  "plugin/.hermes/plugins/liter-llm/skills/*/SKILL.md",
  "plugin/.opencode/skills/*/SKILL.md",
  "plugin/.pi/skills/*/SKILL.md",
  "plugin/skills/*/SKILL.md",
  "skills/*/SKILL.md",
]
reason = "The generated harness and plugin copies repeat the source skill descriptions and names. ai-rulez counts each copy as a duplicate."
