  "plugin/.claude-plugin/**",
  "plugin/.codex-plugin/**",
  "plugin/.cursor-plugin/**",
  "plugin/.factory-plugin/**",
  "plugin/.opencode/**",
  "plugin/.hermes/**",
  "plugin/skills/**",
  "plugin/.mcp.json",
  "plugin/gemini-extension.json",
  "plugin/kimi.plugin.json",
  "plugin/package.json",
  "plugin/.ai-rulez-generated.json",
  ".claude-plugin/marketplace.json",
  ".agents/plugins/marketplace.json",
  ".ai-rulez-generated.json",
  "**/artifacts/**",
  "**/dist/**",
  "**/node_modules/**",
  "**/target/**",
  "**/vendor/**",
  "schemas/**",
] }
cargo = true
commit = { stages = ["commit-msg"] }

[hooks.pre-commit.commands.pyrefly]
run = "pyrefly check packages/python"
workspace = true
files = "packages/python/**/*.py"

[hooks.pre-commit.commands.golangci-lint]
run = "golangci-lint run ./..."
root = "packages/go"
workspace = true
files = "packages/go/**/*.go"

[hooks.pre-commit.commands.checkstyle]
run = "mvn -q checkstyle:check"
root = "packages/java"
workspace = true
files = "packages/java/**/*.java"

[hooks.pre-commit.commands.credo]
run = "mix deps.get && mix credo --strict"
root = "packages/elixir"
workspace = true
files = "packages/elixir/**/*.{ex,exs}"

[[hooks.sources]]
id = "ai-rulez"
git = "https://github.com/Goldziher/ai-rulez.git"
revision = "v4.9.3"
hooks = ["ai-rulez-validate"]

# Shell is two-space in this tree. Both keys are load-bearing: without `enabled` poly runs no shell
# formatter at all, and without `indent_width` it falls through to the language default of four and
# reindents every script. poly resolves this from here, not .editorconfig -- it pipes stdin to shfmt
# with an explicit -i, under which .editorconfig is inert by design. ~keep
[fmt.shell.shfmt]
enabled = true
indent_width = 2
