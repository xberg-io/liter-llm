name: CI Docs

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "alef.toml"
      - "mise.toml"
      - "mise-tasks/**"
      - ".textlintrc.json"
      - ".textlintignore"
      - "scripts/ci/check_prose_gate.py"
      - "schemas/providers.json"
      - "scripts/generate_providers_doc.py"
      - ".github/workflows/ci-docs.yaml"
  pull_request:
    branches: [main]
    paths:
      - "docs-site/**"
      - "alef.toml"
      - "mise.toml"
      - "mise-tasks/**"
      - ".textlintrc.json"
      - ".textlintignore"
      - "scripts/ci/check_prose_gate.py"
      - "schemas/providers.json"
      - "scripts/generate_providers_doc.py"
      - ".github/workflows/ci-docs.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docs:
    # ~keep Reviewed standalone prose support: https://github.com/xberg-io/actions/pull/63
    uses: xberg-io/actions/.github/workflows/reusable-docs-deploy.yml@v1
    with:
      prose-dependency-directory: docs-site
      deploy: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  # providers.md is generated from schemas/providers.json; a schema change without a regenerated
  # page fails here. ~keep
  providers-page:
    name: Providers page is current
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: python
      - name: Check docs-site/src/content/docs/providers.md
        run: python3 scripts/generate_providers_doc.py --validate
