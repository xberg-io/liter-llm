name: Sync Model Catalog

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: sync-catalog
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Refresh catalog.json from models.dev
    if: github.repository == 'xberg-io/liter-llm'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ~keep A GitHub App token (not the default GITHUB_TOKEN) is required so
      # ~keep the sync PR triggers `catalog-verify` and any required status
      # ~keep checks — PRs opened with GITHUB_TOKEN do not trigger further
      # ~keep workflow runs, which would leave auto-merge blocked forever.
      # ~keep Same pattern as publish.yaml and ../sdks spec-sync.yml.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      # ~keep rust is a mise lock gap (rustup script install); rust-toolchain.toml pins it.
      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: sync-catalog

      - name: Setup mise
        uses: xberg-io/actions/setup-mise@v1
        with:
          install: "false"

      - name: Refresh catalog
        run: mise run generate:catalog
        shell: bash

      - name: Detect drift
        id: diff
        run: |
          if git diff --quiet -- schemas/catalog.json crates/liter-llm/schemas/catalog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Open PR
        id: cpr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: sync model catalog from models.dev"
          title: "chore: sync model catalog from models.dev"
          body: |
            Automated refresh of `schemas/catalog.json` and
            `crates/liter-llm/schemas/catalog.json` from
            [models.dev](https://models.dev), produced by `mise run generate:catalog`.

            Merges automatically once required checks pass.
          branch: catalog-sync
          delete-branch: true
          add-paths: |
            schemas/catalog.json
            crates/liter-llm/schemas/catalog.json

      - name: Enable auto-merge
        if: steps.diff.outputs.changed == 'true' && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        # ~keep `gh pr merge --auto` can fail for reasons that still leave a
        # ~keep direct squash merge possible: "Pull request is in clean status"
        # ~keep (already mergeable — GitHub only lets auto-merge be armed while
        # ~keep something is still blocking the merge) or "Branch does not have
        # ~keep required protected branch rules (enablePullRequestAutoMerge)"
        # ~keep (auto-merge isn't enabled on the repo/branch at all). Retry with
        # ~keep a direct merge on any `--auto` failure, and only fail the step
        # ~keep if that direct merge also fails.
        run: |
          if ! output="$(gh pr merge "$PR" --auto --squash 2>&1)"; then
            echo "$output"
            echo "Auto-merge unavailable; attempting a direct merge."
            gh pr merge "$PR" --squash
          fi
        shell: bash
