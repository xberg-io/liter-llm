  publish-crates:
    name: Publish crates.io
    needs: [prepare, validate-versions, registry-results]
    if: |
      always() &&
      needs.prepare.outputs.release_crates == 'true' &&
      needs.validate-versions.result == 'success' &&
      (needs.registry-results.outputs.cratesio != 'true' || needs.prepare.outputs.force_republish == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - uses: xberg-io/actions/setup-rust@v1
        with:
          use-sccache: false
      - uses: xberg-io/actions/publish-crates@v1
        with:
          crates: liter-llm liter-llm-ffi liter-llm-proxy liter-llm-cli
          version: ${{ needs.prepare.outputs.version }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}

  # ~keep `needs.publish-crates.result != 'failure'` is TRUE when publish-crates was SKIPPED,
  # and publish-crates skips for two opposite reasons: the version is already on crates.io
  # (a re-run or a resumed release — downstream must proceed), or an upstream gate such as
  # cargo-packages failed (downstream must NOT proceed). `result` alone cannot tell them
  # apart, so every downstream job that read it was gating on nothing: tree-sitter-language-pack
  # v1.15.5 published a GitHub release to zero registries that way and still reported success.
  # This job always runs, so its outputs always exist, and it resolves the ambiguity once into
  # an explicit outcome the whole workflow tests instead of re-deriving it at each call site.
  crates-gate:
    name: Crates.io publish gate
    needs: [prepare, registry-results, publish-crates]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.decide.outputs.ok }}
      outcome: ${{ steps.decide.outputs.outcome }}
    steps:
      - id: decide
        name: Decide whether the crates.io prerequisite is satisfied
        shell: bash
        env:
          RESULT_PUBLISH_CRATES: ${{ needs.publish-crates.result }}
          RELEASE_CRATES: ${{ needs.prepare.outputs.release_crates }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          FORCE_REPUBLISH: ${{ needs.prepare.outputs.force_republish }}
          ALREADY_ON_CRATESIO: ${{ needs.registry-results.outputs.cratesio }}
        run: |
          set -uo pipefail

          if [[ "${RESULT_PUBLISH_CRATES}" == "failure" ]]; then
            outcome="blocked"
          elif [[ "${RESULT_PUBLISH_CRATES}" == "success" ]]; then
            outcome="published"
          elif [[ "${RELEASE_CRATES}" != "true" ]]; then
            outcome="not-required"
          elif [[ "${DRY_RUN}" == "true" ]]; then
            outcome="dry-run"
          elif [[ "${ALREADY_ON_CRATESIO}" == "true" && "${FORCE_REPUBLISH}" != "true" ]]; then
            outcome="already-present"
          else
            outcome="blocked"
          fi

          if [[ "${outcome}" == "blocked" ]]; then
            ok="false"
            echo "::error title=crates.io prerequisite not met::publish-crates finished with '${RESULT_PUBLISH_CRATES}' and this version is not on crates.io — every job that builds or publishes against the released crate will be held back."
          else
            ok="true"
          fi

          echo "outcome=${outcome}" >>"$GITHUB_OUTPUT"
          echo "ok=${ok}" >>"$GITHUB_OUTPUT"
          echo "crates-gate: outcome=${outcome} ok=${ok} (publish-crates=${RESULT_PUBLISH_CRATES})"

  publish-pypi:
    name: Publish PyPI
    needs: [prepare, validate-versions, registry-results, build-python-wheels, build-python-sdist]
    if: |
      always() &&
      needs.prepare.outputs.release_python == 'true' &&
      needs.validate-versions.result == 'success' &&
      needs.build-python-wheels.result == 'success' &&
      needs.build-python-sdist.result == 'success' &&
      (needs.registry-results.outputs.pypi != 'true' || needs.prepare.outputs.force_republish == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/liter-llm
    steps:
      - name: Re-check PyPI before publishing
        uses: xberg-io/actions/check-registry@v1
        id: recheck
        with:
          registry: pypi
          package: liter-llm
          version: ${{ needs.prepare.outputs.version }}
      - name: Download all wheel + sdist artifacts
        if: steps.recheck.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - name: List packages to publish
        if: steps.recheck.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true'
        run: |
          echo "Packages in dist:"
          ls -lh dist/ 2>/dev/null || echo "No packages found"
        shell: bash
      - name: Publish to PyPI
        if: needs.prepare.outputs.dry_run != 'true' && (steps.recheck.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true')
        uses: xberg-io/actions/publish-pypi@v1
        with:
          packages-dir: dist/
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.pypi_version }}

  publish-node:
    name: Publish Node packages
    needs: [prepare, validate-versions, registry-results, build-node-native]
    if: |
      always() &&
      needs.prepare.outputs.release_node == 'true' &&
      needs.validate-versions.result == 'success' &&
      (needs.registry-results.outputs.npm != 'true' || needs.prepare.outputs.dry_run == 'true') &&
      needs.build-node-native.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: Download Node artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: node-native-*
          path: crates/liter-llm-node/artifacts
          merge-multiple: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install @napi-rs/cli
        run: npm install -g @napi-rs/cli
        shell: bash

      - name: Assemble NAPI platform packages
        run: |
          napi artifacts --output-dir artifacts --npm-dir npm
        working-directory: crates/liter-llm-node
        shell: bash

      - name: Node artifacts summary
        if: ${{ needs.prepare.outputs.dry_run == 'true' }}
        run: (echo "Dry run requested; Node binding tarballs staged:" && find crates/liter-llm-node/artifacts -name '*.node' -print) >> "$GITHUB_STEP_SUMMARY"

      - name: Install workspace dependencies
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        run: |
          # e2e/wasm depends on file:../../crates/liter-llm-wasm/pkg/nodejs (built by wasm-pack
          # --target nodejs, gitignored). During the publish-node workspace scan that path must
          # resolve, so stub a minimal package.
          mkdir -p crates/liter-llm-wasm/pkg/nodejs
          if [ ! -f crates/liter-llm-wasm/pkg/nodejs/package.json ]; then
            cat > crates/liter-llm-wasm/pkg/nodejs/package.json <<'JSON'
          {"name": "liter_llm", "version": "0.0.0", "private": true}
          JSON
          fi
          # --no-frozen-lockfile because crates/liter-llm-node/package.json declares
          # `optionalDependencies: @xberg-io/liter-llm-<rid>@<version>` entries
          # for the per-platform stubs alef-scaffold emits for napi-rs, but those
          # packages don't exist on npm yet at this point in the workflow — this very
          # step is preparing to publish them. The default `--frozen-lockfile` rejects
          # the resolution gap; we want pnpm to install what it can (workspace links +
          # the napi-rs dev tooling) and silently skip the not-yet-published optionals.
          pnpm install -C crates/liter-llm-node --no-frozen-lockfile
        shell: bash

      - name: Pack platform packages
        run: |
          for pkg_dir in crates/liter-llm-node/npm/*/; do
            echo "Packing $pkg_dir..."
            (cd "$pkg_dir" && npm pack && mv ./*.tgz ..)
          done

      - name: Re-check npm before publish
        id: recheck
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: npm
          package: "@xberg-io/liter-llm"
          version: ${{ needs.prepare.outputs.version }}

      # The platform packages version in lockstep with the main package, so one
      # resolution against @xberg-io/liter-llm governs the whole set. ~keep
      - name: Resolve npm dist-tag
        id: dist_tag
        uses: ./.github/actions/resolve-npm-dist-tag
        with:
          package: "@xberg-io/liter-llm"
          version: ${{ needs.prepare.outputs.version }}
          requested-tag: ${{ needs.prepare.outputs.npm_tag }}

      - name: Publish native binary packages
        if: ${{ needs.prepare.outputs.dry_run != 'true' && steps.recheck.outputs.exists != 'true' }}
        uses: xberg-io/actions/publish-npm@v1
        with:
          packages-dir: crates/liter-llm-node/npm
          npm-tag: ${{ steps.dist_tag.outputs.tag }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.version }}

      - name: Wait for npm indexing (x64)
        if: ${{ needs.prepare.outputs.dry_run != 'true' && steps.recheck.outputs.exists != 'true' }}
        uses: xberg-io/actions/wait-for-package@v1
        with:
          registry: npm
          package: "@xberg-io/liter-llm-linux-x64-gnu"
          version: ${{ needs.prepare.outputs.version }}
          max-attempts: "25"

      - name: Wait for npm indexing (ARM64)
        if: ${{ needs.prepare.outputs.dry_run != 'true' && steps.recheck.outputs.exists != 'true' }}
        uses: xberg-io/actions/wait-for-package@v1
        with:
          registry: npm
          package: "@xberg-io/liter-llm-linux-arm64-gnu"
          version: ${{ needs.prepare.outputs.version }}
          max-attempts: "25"

      - name: Publish main Node package
        if: ${{ needs.prepare.outputs.dry_run != 'true' && steps.recheck.outputs.exists != 'true' }}
        uses: xberg-io/actions/publish-npm@v1
        with:
          package-dir: crates/liter-llm-node
          npm-tag: ${{ steps.dist_tag.outputs.tag }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          provenance: "true"
          expected-version: ${{ needs.prepare.outputs.version }}

      - name: Wait for @xberg-io/liter-llm to be available
        if: ${{ needs.prepare.outputs.dry_run != 'true' && steps.recheck.outputs.exists != 'true' }}
        uses: xberg-io/actions/wait-for-package@v1
        with:
          registry: npm
          package: "@xberg-io/liter-llm"
          version: ${{ needs.prepare.outputs.version }}
          max-attempts: "25"

      - name: npm already published summary
        if: ${{ steps.recheck.outputs.exists == 'true' }}
        run: echo "Node package @xberg-io/liter-llm@${{ needs.prepare.outputs.version }} already published on npm — skipped." >> "$GITHUB_STEP_SUMMARY"

  publish-wasm:
    name: Publish WASM package
    needs: [prepare, validate-versions, registry-results, build-wasm, publish-node]
    if: |
      always() &&
      needs.prepare.outputs.release_wasm == 'true' &&
      needs.validate-versions.result == 'success' &&
      (needs.registry-results.outputs.npm_wasm != 'true' || needs.prepare.outputs.dry_run == 'true') &&
      needs.build-wasm.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    steps:
      # Needed only so `./.github/actions/resolve-npm-dist-tag` resolves; the package
      # itself is published from the downloaded `dist` artifact. ~keep
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Download WASM artifact
        uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
          path: dist

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Check if version already published to npm
        id: npm_check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: npm
          package: "@xberg-io/liter-llm-wasm"
          version: ${{ needs.prepare.outputs.version }}

      - name: WASM artifact summary
        if: ${{ needs.prepare.outputs.dry_run == 'true' }}
        run: (echo "Dry run requested; WASM tarball staged:" && find dist -type f -print) >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve npm dist-tag
        id: dist_tag
        uses: ./.github/actions/resolve-npm-dist-tag
        with:
          package: "@xberg-io/liter-llm-wasm"
          version: ${{ needs.prepare.outputs.version }}
          requested-tag: ${{ needs.prepare.outputs.npm_tag }}

      - name: Publish to npm
        if: ${{ needs.prepare.outputs.dry_run != 'true' && steps.npm_check.outputs.exists != 'true' }}
        uses: xberg-io/actions/publish-npm@v1
        with:
          package-dir: dist
          npm-tag: ${{ steps.dist_tag.outputs.tag }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          provenance: "true"
          expected-version: ${{ needs.prepare.outputs.version }}

      - name: Wait for npm indexing
        if: ${{ needs.prepare.outputs.dry_run != 'true' && steps.npm_check.outputs.exists != 'true' }}
        uses: xberg-io/actions/wait-for-package@v1
        with:
          registry: npm
          package: "@xberg-io/liter-llm-wasm"
          version: ${{ needs.prepare.outputs.version }}
          max-attempts: "25"

      - name: Publish summary
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        run: |
          if [ "${{ steps.npm_check.outputs.exists }}" = "true" ]; then
            echo "WASM package @xberg-io/liter-llm-wasm@${{ needs.prepare.outputs.version }} already published on npm — skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published @xberg-io/liter-llm-wasm@${{ needs.prepare.outputs.version }} to npm." >> "$GITHUB_STEP_SUMMARY"
          fi

  publish-rubygems:
    name: Publish RubyGems
    needs: [prepare, validate-versions, registry-results, build-ruby-gem]
    if: |
      always() &&
      needs.prepare.outputs.release_ruby == 'true' &&
      needs.validate-versions.result == 'success' &&
      needs.build-ruby-gem.result == 'success' &&
      (needs.registry-results.outputs.rubygems != 'true' || needs.prepare.outputs.force_republish == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Download Ruby gem artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: rubygems-*
          path: dist
          merge-multiple: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: none
          bundler-cache: false

      - name: Install Bundler
        shell: bash
        run: (gem install bundler -v 4.0.0 --no-document || gem install bundler --no-document) && bundler --version

      - name: Install Ruby dependencies
        shell: bash
        working-directory: packages/ruby
        run: |
          bundle config set --local path vendor/bundle
          bundle install --jobs 4

      - name: Rewrite native dependencies to registry versions
        if: needs.prepare.outputs.dry_run != 'true'
        uses: xberg-io/actions/rewrite-native-deps@v1
        with:
          lang: ruby

      - name: Build source gem (fallback for unsupported platforms)
        shell: bash
        working-directory: packages/ruby
        run: |
          bundle config set --local path vendor/bundle
          bundle check || bundle install
          bundle exec rake build

      - name: Copy source gem to dist directory
        shell: bash
        run: |
          mkdir -p dist
          cp packages/ruby/pkg/*.gem dist/

      - name: List all gems for publishing
        shell: bash
        working-directory: dist
        run: |
          echo "=== All gems to publish ==="
          ls -lh liter_llm-*.gem
          echo ""
          gem_count=$(find . -maxdepth 1 -name 'liter_llm-*.gem' -print | wc -l)
          echo "Total gems: $gem_count"
          echo ""
          echo "Expected:"
          echo "  - Source gem: liter_llm-VERSION.gem"
          echo "  - Linux x86_64: liter_llm-VERSION-x86_64-linux.gem"
          echo "  - Linux ARM64: liter_llm-VERSION-aarch64-linux.gem"
          echo "  - macOS ARM64: liter_llm-VERSION-arm64-darwin.gem"
          if [ "$gem_count" -lt 2 ]; then
            echo "WARNING: Expected at least 2 gems (source + platform), found $gem_count" >&2
          fi

      - name: Re-check RubyGems before publish
        id: recheck
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: rubygems
          package: liter_llm
          version: ${{ needs.prepare.outputs.version }}

      - name: Configure trusted publishing credentials
        if: ${{ needs.prepare.outputs.dry_run != 'true' && steps.recheck.outputs.exists != 'true' }}
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Publish gems to RubyGems
        if: ${{ needs.prepare.outputs.dry_run != 'true' && steps.recheck.outputs.exists != 'true' }}
        uses: xberg-io/actions/publish-rubygems@v1
        with:
          gems-dir: dist
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.gem_version }}

      - name: RubyGems already published summary
        if: ${{ steps.recheck.outputs.exists == 'true' }}
        run: echo "Gem liter_llm@${{ needs.prepare.outputs.version }} already published on RubyGems — skipped." >> "$GITHUB_STEP_SUMMARY"

  publish-maven:
    name: Publish Maven Central
    needs: [prepare, validate-versions, registry-results, build-java-package]
    if: |
      always() &&
      needs.prepare.outputs.release_java == 'true' &&
      needs.validate-versions.result == 'success' &&
      needs.build-java-package.result == 'success' &&
      (needs.registry-results.outputs.maven != 'true' || needs.prepare.outputs.force_republish == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - uses: actions/download-artifact@v8
        with:
          name: maven-packages
          path: packages/java/target
      - uses: actions/download-artifact@v8
        with:
          pattern: ffi-*
          path: ffi-artifacts
          merge-multiple: true
      - name: Stage native libs for Java publish
        run: |
          declare -A rid_map=(
            [linux-x64]="linux-x64"
            [linux-arm64]="linux-arm64"
            [osx-arm64]="macos-arm64"
            [win-x64]="windows-x64"
          )
          for ffi_rid in "${!rid_map[@]}"; do
            java_rid="${rid_map[$ffi_rid]}"
            dest="packages/java/src/main/resources/natives/${java_rid}"
            mkdir -p "$dest"
            find "ffi-artifacts/${ffi_rid}" -type f -print0 | xargs -0 -I{} cp {} "$dest/"
          done
        shell: bash
      - name: Setup Java
        id: setup-java
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Setup Maven 3.9.11
        uses: xberg-io/actions/setup-maven@v1
      - name: Configure Maven GPG
        uses: xberg-io/actions/configure-maven-gpg@v1
        with:
          pom-file: packages/java/pom.xml
      - name: Release Maven package
        uses: xberg-io/actions/publish-maven@v1
        with:
          pom-file: packages/java/pom.xml
          maven-profile: publish
          extra-args: -DskipTests
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.version }}
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  publish-kotlin-android-maven:
    name: Publish Kotlin Android AAR to Maven Central
    needs: [prepare, validate-versions, build-kotlin-android-natives, upload-kotlin-android-aars]
    if: |
      always() &&
      needs.prepare.outputs.release_kotlin == 'true' &&
      needs.validate-versions.result == 'success' &&
      (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Download pre-built AARs from build matrix
        uses: actions/download-artifact@v8
        with:
          pattern: kotlin-android-*
          path: kotlin-android-aars-prebuilt
          merge-multiple: true
      - name: Stage JNI libraries from build artifacts
        shell: bash
        run: |
          # The build-kotlin-android-natives job stages jniLibs into src/main/jniLibs/{abi}/
          # within its own workspace, then runs gradle assembleRelease to package them into AARs.
          # The pre-built AARs are uploaded as artifacts.
          #
          # To prevent gradle from rebuilding the AAR from source (which would lose jniLibs),
          # we extract the jniLibs from the pre-built AARs and re-stage them so that when
          # publishAndReleaseToMavenCentral re-assembles, it includes them.
          for aar in kotlin-android-aars-prebuilt/*.aar; do
            # Validate archive integrity before extracting. A truncated
            # artifact transfer surfaces deep inside `unzip` as a cryptic
            # "bad zipfile offset (local header sig)"; test it up front and
            # fail with an actionable message instead.
            if ! unzip -tqq "$aar" >/dev/null 2>&1; then
              echo "ERROR: $(basename "$aar") is a corrupt/truncated zip ($(wc -c < "$aar") bytes)." >&2
              echo "This is typically a transient artifact-transfer failure; re-run this job." >&2
              exit 1
            fi
            echo "Extracting jniLibs from $(basename "$aar")..."
            unzip -q "$aar" -d temp-aar-extract
            # Each pre-built AAR contains jni/{abi}/*.so (Android AAR structure)
            if [ -d temp-aar-extract/jni ]; then
              for abi_dir in temp-aar-extract/jni/*/; do
                abi=$(basename "$abi_dir")
                mkdir -p "packages/kotlin-android/src/main/jniLibs/$abi"
                find "$abi_dir" -type f -name "*.so" -exec cp {} "packages/kotlin-android/src/main/jniLibs/$abi/" \;
                echo "  Staged jniLibs/$abi from AAR"
              done
            fi
            rm -rf temp-aar-extract
          done
          # Verify jniLibs were staged
          if [ ! -d packages/kotlin-android/src/main/jniLibs ] || [ -z "$(find packages/kotlin-android/src/main/jniLibs -type f)" ]; then
            echo "ERROR: No jniLibs staged from AARs!" >&2
            exit 1
          fi
          echo "jniLibs staging complete:"
          find packages/kotlin-android/src/main/jniLibs -type f -exec ls -lh {} \;
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: xberg-io/actions/setup-maven@v1
      - uses: xberg-io/actions/configure-maven-gpg@v1
      - uses: xberg-io/actions/publish-maven-gradle@v1
        with:
          working-directory: packages/kotlin-android
          gradle-task: publishAndReleaseToMavenCentral
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

  publish-hex:
    name: Publish Hex.pm
    needs: [prepare, validate-versions, registry-results, publish-crates, build-elixir-nifs, upload-elixir-nifs]
    if: |
      always() &&
      needs.prepare.outputs.release_elixir == 'true' &&
      needs.validate-versions.result == 'success' &&
      needs.upload-elixir-nifs.result == 'success' &&
      (needs.registry-results.outputs.hex != 'true' || needs.prepare.outputs.force_republish == 'true')
    runs-on: ubuntu-latest
    environment: hex
    permissions:
      id-token: write
    timeout-minutes: 30
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Generate checksums from GitHub release
        if: needs.prepare.outputs.dry_run != 'true'
        uses: xberg-io/actions/generate-elixir-checksums@v1
        with:
          github-repo: xberg-io/liter-llm
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}
          lib-name: liter_llm_nif
          targets: "aarch64-apple-darwin,aarch64-unknown-linux-gnu,x86_64-unknown-linux-gnu,x86_64-pc-windows-gnu"
          output-path: packages/elixir/checksum-Elixir.LiterLlm.Native.exs

      - name: Commit updated checksum file to main
        if: needs.prepare.outputs.dry_run != 'true'
        run: |
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"
          git add packages/elixir/checksum-Elixir.LiterLlm.Native.exs
          if git diff --cached --quiet; then
            echo "No checksum changes to commit — skipping"
            exit 0
          fi
          CHECKSUM_SNAPSHOT="$(mktemp)"
          cp packages/elixir/checksum-Elixir.LiterLlm.Native.exs "$CHECKSUM_SNAPSHOT"
          git commit -m "chore: update Elixir NIF checksums for v${{ needs.prepare.outputs.version }}"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:refs/heads/main; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push attempt $i failed; retrying after rebase"
            if [ "$i" -eq 5 ]; then
              echo "ERROR: push failed after 5 attempts" >&2
              exit 1
            fi
            git fetch origin main
            git reset --hard origin/main
            cp "$CHECKSUM_SNAPSHOT" packages/elixir/checksum-Elixir.LiterLlm.Native.exs
            git add packages/elixir/checksum-Elixir.LiterLlm.Native.exs
            if git diff --cached --quiet; then
              echo "Remote already has these checksums — done"
              exit 0
            fi
            git commit -m "chore: update Elixir NIF checksums for v${{ needs.prepare.outputs.version }}"
            sleep $((i * 2))
          done
        shell: bash

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Install Mix dependencies
        run: mix local.hex --force && mix local.rebar --force && mix deps.get
        working-directory: packages/elixir
        shell: bash

      - uses: xberg-io/actions/publish-hex@v1
        with:
          package-dir: packages/elixir
          skip-docs: "true"
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.version }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

  publish-nuget:
    name: Publish NuGet
    needs: [prepare, validate-versions, registry-results, build-csharp-package]
    if: |
      always() &&
      needs.prepare.outputs.release_csharp == 'true' &&
      needs.validate-versions.result == 'success' &&
      needs.build-csharp-package.result == 'success' &&
      (needs.registry-results.outputs.nuget != 'true' || needs.prepare.outputs.force_republish == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: nuget-output
      - uses: xberg-io/actions/publish-nuget@v1
        with:
          packages-dir: nuget-output
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.version }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  publish-packagist:
    name: Publish Packagist
    needs: [prepare, validate-versions, registry-results, upload-php-extensions]
    if: |
      always() &&
      needs.prepare.outputs.release_php == 'true' &&
      needs.upload-php-extensions.result == 'success' &&
      needs.validate-versions.result == 'success' &&
      (needs.registry-results.outputs.packagist != 'true' || needs.prepare.outputs.force_republish == 'true')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: xberg-io/actions/publish-packagist@v1
        with:
          packagist-username: xberg-io
          package-name: xberg-io/liter-llm
          version: ${{ needs.prepare.outputs.version }}
          repository-url: https://github.com/xberg-io/liter-llm
          dry-run: ${{ needs.prepare.outputs.dry_run }}
        env:
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}

  trigger-pubdev:
    name: Trigger pub.dev publish workflow
    needs: [prepare, check-pub, assemble-dart-package]
    if: ${{ needs.prepare.outputs.release_dart == 'true' && needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.dry_run != 'true' && (needs.check-pub.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
      - name: Dispatch publish-pubdev workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run publish-pubdev.yaml \
            --ref ${{ needs.prepare.outputs.tag }} \
            -f run_id=${{ github.run_id }}

  publish-zig:
    name: Publish Zig package metadata
    needs: [prepare, validate-versions, check-zig, build-ffi]
    # ~keep `!cancelled()` is load-bearing. On a partial-target dispatch the crates-chain jobs
    # skip, an upstream job survives only via its own `!cancelled()`, and GitHub's skipped-state
    # propagation then resumes at the first dependent that declares no opt-out -- skipping it
    # before this `if:` is ever evaluated, with every build leg green. Diagnosed on
    # html-to-markdown runs 33491693123/33494806766/33495781759, fixed there in 98d4537c41.
    # Every need that must have succeeded is already named explicitly below, which is what
    # opting out of propagation requires.
    if: |
      !cancelled() &&
      needs.prepare.outputs.release_zig == 'true' &&
      needs.prepare.outputs.is_tag == 'true' &&
      needs.validate-versions.result == 'success' &&
      (needs.check-zig.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') &&
      needs.build-ffi.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - uses: actions/download-artifact@v8
        with:
          pattern: ffi-*
          path: ffi-artifacts
          merge-multiple: true
      - uses: xberg-io/actions/publish-zig@v1
        with:
          working-directory: packages/zig
          tag: ${{ needs.prepare.outputs.tag }}
          token: ${{ steps.app-token.outputs.token }}
          # ~keep → 404 + consumer build.zig.zon placeholder hash.
          package-name: liter-llm-zig
          multi-platform-ffi-dir: ffi-artifacts
          module-name: liter_llm
          ffi-lib-name: liter_llm_ffi
          update-release-notes: "true"
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          update-existing: "true"

  swift-artifactbundle:
    name: Build Swift Artifact Bundle
    needs: [prepare]
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.prepare.outputs.release_swift == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    outputs:
      checksum: ${{ steps.checksum.outputs.checksum }}
      reused: ${{ steps.check-existing.outputs.reused }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Check if artifact already exists on release
        id: check-existing
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="LiterLlm-rs.artifactbundle.zip"
          # Try to download the artifact from the GitHub release.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            if gh release download "v${VERSION}" -p "${ARTIFACT_NAME}" -D /tmp 2>/dev/null; then
              # Artifact exists; compute its checksum.
              CHECKSUM=$(swift package compute-checksum "/tmp/${ARTIFACT_NAME}")
              echo "reused=true" >> "$GITHUB_OUTPUT"
              echo "checksum=${CHECKSUM}" >> "$GITHUB_OUTPUT"
              echo "Reusing existing artifact bundle with checksum: ${CHECKSUM}"
              exit 0
            fi
          fi
          # Release doesn't exist or artifact not found; proceed to build.
          echo "reused=false" >> "$GITHUB_OUTPUT"
          exit 0

      - uses: xberg-io/actions/setup-rust@v1
        if: ${{ steps.check-existing.outputs.reused != 'true' }}
        with:
          cache-key-prefix: publish-swift-artifactbundle
          use-sccache: false

      - uses: xberg-io/actions/build-swift-artifactbundle@v1
        if: ${{ steps.check-existing.outputs.reused != 'true' }}
        id: build
        with:
          crate-name: liter-llm-swift
          artifact-name: LiterLlm-rs
          header-path: target/release/build/liter-llm-swift-*/out
          output-dir: dist/swift-artifactbundle
          build-profile: release

      - name: Record checksum from build or reused
        id: checksum
        run: |
          if [[ "${{ steps.check-existing.outputs.reused }}" == "true" ]]; then
            # Checksum already set by check-existing step
            CHECKSUM="${{ steps.check-existing.outputs.checksum }}"
          else
            # Compute from newly built artifact
            CHECKSUM=$(cat "${{ steps.build.outputs.bundle-zip }}.sha256" 2>/dev/null || swift package compute-checksum "${{ steps.build.outputs.bundle-zip }}")
          fi
          echo "checksum=${CHECKSUM}" >> "$GITHUB_OUTPUT"
          echo "Artifact bundle checksum: ${CHECKSUM}"

      - uses: actions/upload-artifact@v7
        if: ${{ steps.check-existing.outputs.reused != 'true' }}
        with:
          name: swift-artifactbundle
          path: dist/swift-artifactbundle
          retention-days: 14

      - name: Save checksum as artifact
        run: |
          mkdir -p dist/swift-checksums
          echo "${{ steps.checksum.outputs.checksum }}" > dist/swift-checksums/LiterLlm-rs.artifactbundle.zip.checksum

      - uses: actions/upload-artifact@v7
        with:
          name: swift-checksum
          path: dist/swift-checksums/
          retention-days: 14

  upload-swift-release:
    name: Upload Swift Artifact Bundle to GitHub Release
    needs: [prepare, validate-versions, swift-artifactbundle]
    if: |
      (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') &&
      needs.validate-versions.result == 'success' &&
      needs.swift-artifactbundle.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - uses: actions/download-artifact@v8
        with:
          pattern: swift-*
          path: dist/swift
          merge-multiple: true

      - name: Skip asset upload if bundle was reused
        if: ${{ needs.swift-artifactbundle.outputs.reused == 'true' }}
        run: |
          echo "Bundle was reused from existing release asset; skipping upload"

      - uses: xberg-io/actions/upload-release-assets@v1
        if: ${{ needs.swift-artifactbundle.outputs.reused != 'true' }}
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          working-directory: dist/swift
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          assets: |
            **/*.zip
            **/*.checksum
          token: ${{ steps.app-token.outputs.token }}

      - name: Create swift-release tag with substituted checksum
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHECKSUM: ${{ needs.swift-artifactbundle.outputs.checksum }}
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          SWIFT_TAG="swift-${VERSION}"

          # Idempotent guard: if the swift tag already exists on origin, skip.
          if git ls-remote --tags origin "refs/tags/${SWIFT_TAG}" 2>/dev/null | grep -q "${SWIFT_TAG}"; then
            echo "Swift tag ${SWIFT_TAG} already exists on origin; skipping."
            exit 0
          fi

          # ~keep Count the field's matches BEFORE substituting and fail on zero. The old
          # check ran afterwards and asserted the placeholder was absent, which is satisfied
          # both by a successful substitution and by the token being renamed or dropped by the
          # generator -- precisely the case the check exists to catch. Both shapes are matched
          # because alef 0.80.0 rewrites `checksum:` whether it holds the placeholder or a
          # 64-hex literal left behind by an earlier release; matching only the placeholder
          # makes the substitution destroy its own trigger the first time a literal reaches
          # main, and every release afterwards silently no-ops. That is not hypothetical --
          # it is what alef bd5ddc3de was fixing.
          checksum_field='(checksum:[[:space:]]*")(__ALEF_SWIFT_CHECKSUM__|[0-9a-f]{64})(")'
          matches="$(grep -cE "${checksum_field}" Package.swift || true)"
          if [ "${matches:-0}" -eq 0 ]; then
            echo "::error::Package.swift has no checksum: field holding __ALEF_SWIFT_CHECKSUM__" \
              "or a 64-hex literal; the manifest's shape has drifted and the artifact bundle" \
              "checksum cannot be pinned" >&2
            exit 1
          fi
          sed -i.bak -E "s/${checksum_field}/\1${CHECKSUM}\3/g" Package.swift
          rm -f Package.swift.bak
          echo "Pinned ${CHECKSUM} into ${matches} checksum field(s)"

          # Configure git
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"

          # Commit the patched Package.swift to a temporary release branch. Now that the
          # substitution is idempotent it can legitimately be a no-op -- alef may already have
          # baked this exact checksum in -- and `git commit` fails on an empty index. ~keep
          if git diff --quiet -- Package.swift; then
            echo "Package.swift already carries ${CHECKSUM}; tagging the checkout as-is."
          else
            git add Package.swift
            git commit -m "chore(swift): pin checksum for ${SWIFT_TAG}"
          fi

          # Create a new tag in the swift namespace (NOT --force, NOT modifying main tag)
          git tag "${SWIFT_TAG}"

          # Push the release branch (not to main, to avoid modifying main)
          git push origin "HEAD:refs/heads/release/swift/${VERSION}"

          # Push the swift tag
          git push origin "refs/tags/${SWIFT_TAG}"

          echo "Created ${SWIFT_TAG} tag on release/swift/${VERSION} branch with real checksum"
        shell: bash

      - name: Generate substituted Package.swift artifact
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHECKSUM: ${{ needs.swift-artifactbundle.outputs.checksum }}
        run: |
          set -euo pipefail
          cp Package.swift /tmp/Package.swift

          # ~keep There is no `__ALEF_SWIFT_VERSION__` left to substitute: alef bakes the
          # concrete release URL into `.binaryTarget` at generation time. The sed that used to
          # run here was therefore a permanent no-op, and nothing noticed, because a
          # substitution that changes nothing is indistinguishable from one with nothing to do.
          # Assert what the artifact actually carries instead. Swift pins in this repo do go
          # stale -- test_apps/swift_e2e/Package.swift still pins release/swift/1.16.0 at
          # 1.19.1 -- and a manifest pairing an old bundle URL with this release's checksum
          # fails verification for every consumer. A dry run's version carries a
          # `-dryrun-<sha>` suffix no manifest will ever hold, so strip it, as the plugin
          # assertion in validate-versions does.
          expected_url="releases/download/v${VERSION%%-dryrun-*}/"
          if [ "$(grep -cF "${expected_url}" /tmp/Package.swift || true)" -eq 0 ]; then
            echo "::error::Package.swift does not reference ${expected_url}; its binaryTarget" \
              "URL has drifted from the release being published" >&2
            exit 1
          fi

          # Same both-shape field and same count-before-substituting rule as the tag step
          # above. By this point the tag step may already have pinned the literal in the
          # working tree, so a placeholder-only match would spuriously report zero. ~keep
          checksum_field='(checksum:[[:space:]]*")(__ALEF_SWIFT_CHECKSUM__|[0-9a-f]{64})(")'
          matches="$(grep -cE "${checksum_field}" /tmp/Package.swift || true)"
          if [ "${matches:-0}" -eq 0 ]; then
            echo "::error::Package.swift has no checksum: field holding __ALEF_SWIFT_CHECKSUM__" \
              "or a 64-hex literal; refusing to publish a manifest with an unpinned checksum" >&2
            exit 1
          fi
          sed -i.bak -E "s/${checksum_field}/\1${CHECKSUM}\3/g" /tmp/Package.swift
          rm -f /tmp/Package.swift.bak

          echo "Substituted Package.swift (${matches} checksum field(s)):"
          head -30 /tmp/Package.swift

      - name: Upload substituted Package.swift to GitHub Release
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release upload "v${VERSION}" /tmp/Package.swift \
            --clobber \
            --repo "${{ github.repository }}"

      - name: Update release notes with Swift install instructions
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          CHECKSUM=${{ needs.swift-artifactbundle.outputs.checksum }}
          ASSET_URL="https://github.com/xberg-io/liter-llm/releases/download/v${VERSION}/LiterLlm-rs.artifactbundle.zip"

          cat > /tmp/swift-notes.md << EOF
          ## Swift Package Manager

          The Swift binding is distributed as a pre-built artifact bundle. No Rust toolchain required.

          **Recommended — use \`.binaryTarget\` directly in your \`Package.swift\`:**

          \`\`\`swift
          .binaryTarget(
              name: "LiterLlm",
              url: "${ASSET_URL}",
              checksum: "${CHECKSUM}"
          )
          \`\`\`

          **Alternative — pin via tag-specific Swift package release:**

          \`\`\`swift
          .package(url: "https://github.com/xberg-io/liter-llm", from: "swift-${VERSION}")
          \`\`\`

          > The main repository's \`Package.swift\` uses placeholder values. Swift consumers pin to a tag-specific release in the \`swift-\` namespace (e.g. \`from: "swift-${VERSION}"\`), which includes the real artifact bundle checksum. Other languages continue to pin to \`from: "${VERSION}"\`.

          **Artifact bundle**: [LiterLlm-rs.artifactbundle.zip](${ASSET_URL})
          **Checksum**: \`${CHECKSUM}\`
          EOF

          gh release edit "v${VERSION}" --notes-file /tmp/swift-notes.md

  build-cli-binaries:
    name: Build CLI binary (${{ matrix.label }})
    needs: [prepare, validate-versions]
    if: |
      always() &&
      needs.prepare.outputs.release_homebrew == 'true' &&
      needs.validate-versions.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - label: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - label: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - label: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}
          cache-key-prefix: publish-cli-${{ matrix.label }}
          use-sccache: false
      - name: Build CLI
        shell: bash
        run: cargo build --release -p liter-llm-cli --target ${{ matrix.target }}
      - name: Stage archive
        id: stage
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          stem="liter-llm-${VERSION}-${TARGET}"
          stage_dir="dist/${stem}"
          mkdir -p "${stage_dir}"
          if [ "${ARCHIVE}" = "zip" ]; then
            cp "target/${TARGET}/release/liter-llm.exe" "${stage_dir}/"
          else
            cp "target/${TARGET}/release/liter-llm" "${stage_dir}/"
          fi
          cp LICENSE README.md "${stage_dir}/"
          cd dist
          if [ "${ARCHIVE}" = "zip" ]; then
            archive_name="${stem}.zip"
            if command -v 7z >/dev/null 2>&1; then
              7z a "${archive_name}" "${stem}" >/dev/null
            else
              powershell -Command "Compress-Archive -Path '${stem}' -DestinationPath '${archive_name}'"
            fi
          else
            archive_name="${stem}.tar.gz"
            tar -czf "${archive_name}" "${stem}"
          fi
          # Emit a sha256sum-format line ("<hash>  <filename>") on every
          # platform so the upload job can concatenate them into a single
          # SHA256SUMS file consumable by `sha256sum -c`.
          if [ "${RUNNER_OS}" = "Windows" ]; then
            hash=$(certutil -hashfile "${archive_name}" SHA256 | sed -n '2p' | tr -d ' \r')
            printf '%s  %s\n' "${hash}" "${archive_name}" > "${archive_name}.sha256"
          else
            shasum -a 256 "${archive_name}" > "${archive_name}.sha256"
          fi
          echo "archive=${archive_name}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: cli-binary-${{ matrix.label }}
          path: |
            dist/${{ steps.stage.outputs.archive }}
            dist/${{ steps.stage.outputs.archive }}.sha256
          retention-days: 14

  upload-cli-binaries:
    name: Upload CLI binaries to GitHub Release
    needs: [prepare, validate-versions, build-cli-binaries]
    if: |
      always() &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.prepare.outputs.release_homebrew == 'true' &&
      needs.validate-versions.result == 'success' &&
      needs.build-cli-binaries.result != 'cancelled' &&
      needs.build-cli-binaries.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-binary-*
          path: dist/cli
          merge-multiple: true
      - name: Consolidate per-archive checksums into SHA256SUMS
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          shasum_files=(dist/cli/*.sha256)
          if [ ${#shasum_files[@]} -eq 0 ]; then
            echo "::error::no per-archive checksum files found"
            exit 1
          fi
          combined="dist/cli/SHA256SUMS-${VERSION}.txt"
          # Sort for deterministic ordering across runs.
          cat "${shasum_files[@]}" | LC_ALL=C sort > "${combined}"
          rm -f "${shasum_files[@]}"
          echo "Consolidated checksums:"
          cat "${combined}"
      - uses: xberg-io/actions/publish-github-release@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          artifacts: "dist/cli/*"
          # ~keep Must stay "true", matching every other upload job. This step ran with
          # "false" through v1.19.0 and un-drafted the release as a side effect of uploading
          # CLI binaries — before a single registry publish, so v1.19.0 sits published on a
          # release that shipped nothing. Promotion belongs to `promote-release` below.
          draft: "true"
          token: ${{ steps.app-token.outputs.token }}

  # ~keep Exists solely to break a dependency cycle. `verify-binstall` needs a PUBLISHED
  # release (binstall resolves `[package.metadata.binstall] pkg-url` to
  # `.../releases/download/v<version>/...`, which 404s while the release is a draft), but
  # `release-finalize` will not promote until binstall has passed. The previous escape was
  # `draft: "false"` on the CLI upload above, which un-drafted the release before any
  # registry publish. Splitting promotion out resolves it in the correct order: this job
  # gates only on the release-blocking jobs (versions, crates.io, and the CLI + C FFI
  # assets), publishes the release, binstall then verifies against it, and
  # `release-finalize` still judges every target afterwards — re-drafting via its
  # `Hold release as draft` step if anything did not ship.
  #
  # Downstream must read `outputs.promoted`, not `.result`: a failure anywhere in a job's
  # `needs` ancestry poisons the value of `needs.<job>.result` even when the job itself
  # concluded `success`. Job outputs carry no such poison.
  promote-release:
    name: Publish GitHub Release from draft
    needs:
      - prepare
      - validate-versions
      - crates-gate
      - upload-cli-binaries
      - upload-c-ffi
      # ~keep Ordering only: the draft flips once every per-language asset upload has
      # settled, so a published release is never missing assets that are still uploading.
      # Their results are deliberately absent from the `if` below -- one language's artifact
      # must not block the release.
      - upload-go-ffi
      - upload-elixir-nifs
      - upload-php-extensions
      - upload-kotlin-android-aars
      - upload-swift-release
    if: |
      !cancelled() &&
      needs.prepare.outputs.is_tag == 'true' &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.validate-versions.result == 'success' &&
      needs.crates-gate.outputs.ok == 'true' &&
      needs.upload-cli-binaries.result == 'success' &&
      needs.upload-c-ffi.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      promoted: ${{ steps.flip.outputs.promoted }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
      - name: Flip release out of draft
        id: flip
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "${TAG}" --draft=false
          echo "promoted=true" >>"$GITHUB_OUTPUT"

  verify-binstall:
    name: Verify cargo-binstall install
    needs: [prepare, upload-cli-binaries, promote-release]
    if: ${{ !cancelled() && needs.prepare.outputs.release_homebrew == 'true' && needs.prepare.outputs.dry_run != 'true' && needs.upload-cli-binaries.result == 'success' && needs.promote-release.outputs.promoted == 'true' }}
    uses: xberg-io/actions/.github/workflows/reusable-binstall-verify.yml@v1
    with:
      package-name: liter-llm-cli
      binary-name: liter-llm
      manifest-path: crates/liter-llm-cli
      checkout-ref: ${{ needs.prepare.outputs.checkout_ref }}
      smoke-command: |
        liter-llm --version

  check-homebrew:
    name: Check Homebrew tap for formula
    needs: [prepare]
    if: ${{ needs.prepare.outputs.release_homebrew == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: xberg-io/actions/check-registry@v1
        id: check
        with:
          registry: homebrew
          package: liter-llm
          version: ${{ needs.prepare.outputs.version }}
          tap-repo: xberg-io/homebrew-tap

  publish-homebrew-formula:
    name: Update Homebrew formula
    needs: [prepare, validate-versions, check-homebrew, crates-gate]
    # ~keep `!cancelled()` is load-bearing. On a partial-target dispatch the crates-chain jobs
    # skip, an upstream job survives only via its own `!cancelled()`, and GitHub's skipped-state
    # propagation then resumes at the first dependent that declares no opt-out -- skipping it
    # before this `if:` is ever evaluated, with every build leg green. Diagnosed on
    # html-to-markdown runs 33491693123/33494806766/33495781759, fixed there in 98d4537c41.
    # Every need that must have succeeded is already named explicitly below, which is what
    # opting out of propagation requires.
    if: |
      !cancelled() &&
      needs.prepare.outputs.release_homebrew == 'true' &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.validate-versions.result == 'success' &&
      needs.check-homebrew.outputs.exists != 'true' &&
      needs.crates-gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/create-github-app-token@v3
        id: tap-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
          repositories: homebrew-tap

      - name: Checkout source repo
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: xberg-io/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: homebrew-tap
          persist-credentials: true

      - name: Update formula source url+sha
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAP_DIR: ${{ github.workspace }}/homebrew-tap
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
        run: scripts/publish/update-homebrew-formula.sh

      - name: Commit and push to tap
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"
          if git diff --quiet Formula/; then
            echo "No formula changes; skipping commit."
            exit 0
          fi
          git add Formula/liter-llm.rb
          git commit -m "liter-llm ${{ needs.prepare.outputs.version }}"
          # Every repo's publish pipeline pushes to this one shared tap, so a concurrent
          # release can land between our checkout and our push and reject it as non-fast-forward.
          # Each repo touches only its own formulas, so rebasing onto the new tip and retrying is
          # safe -- there is nothing for two releases to genuinely conflict over. ~keep
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the current tap tip"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::tap rebase hit a real conflict; refusing to force the push"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::could not push to the tap after 5 attempts"
          exit 1

  # The Windows counterpart of publish-homebrew-formula. There is deliberately no
  # `check-scoop` idempotency gate: the render step rewrites the manifest in place and
  # the commit below is guarded by `git diff --quiet bucket/`, so re-running a release
  # is already a no-op. ~keep
  publish-scoop-manifest:
    name: Update Scoop manifest
    needs: [prepare, validate-versions, upload-cli-binaries]
    # ~keep `!cancelled()` is load-bearing. On a partial-target dispatch the crates-chain jobs
    # skip, an upstream job survives only via its own `!cancelled()`, and GitHub's skipped-state
    # propagation then resumes at the first dependent that declares no opt-out -- skipping it
    # before this `if:` is ever evaluated, with every build leg green. Diagnosed on
    # html-to-markdown runs 33491693123/33494806766/33495781759, fixed there in 98d4537c41.
    # Every need that must have succeeded is already named explicitly below, which is what
    # opting out of propagation requires.
    if: |
      !cancelled() &&
      needs.prepare.outputs.release_scoop == 'true' &&
      needs.validate-versions.result == 'success' &&
      needs.upload-cli-binaries.result == 'success' &&
      (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: bucket-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
          repositories: scoop-bucket

      - uses: actions/create-github-app-token@v3
        id: source-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - uses: actions/checkout@v7
        with:
          repository: xberg-io/scoop-bucket
          token: ${{ steps.bucket-token.outputs.token }}
          path: scoop-bucket
          persist-credentials: true

      - uses: xberg-io/actions/publish-scoop-manifests@v1
        with:
          bucket-dir: ${{ github.workspace }}/scoop-bucket
          config-file: scripts/publish/scoop.json
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}
          github-repo: ${{ github.repository }}
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          token: ${{ steps.source-token.outputs.token }}

      - name: Commit and push to bucket
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        working-directory: scoop-bucket
        env:
          GH_TOKEN: ${{ steps.bucket-token.outputs.token }}
        run: |
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"
          if git diff --quiet bucket/; then
            echo "No manifest changes; skipping commit."
            exit 0
          fi
          git add bucket/liter-llm.json
          git commit -m "liter-llm ${{ needs.prepare.outputs.version }}"
          # Six release pipelines push to this one bucket, so a concurrent release can land
          # between our checkout and our push and reject it as non-fast-forward. Each repo
          # touches only its own manifest, so rebasing onto the new tip and retrying is safe --
          # there is nothing for two releases to genuinely conflict over. ~keep
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the current bucket tip"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::bucket rebase hit a real conflict; refusing to force the push"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::could not push to the bucket after 5 attempts"
          exit 1

  homebrew-bottles:
    name: Build Homebrew bottle (${{ matrix.bottle_tag }})
    needs: [prepare, publish-homebrew-formula]
    # ~keep `!cancelled()` is load-bearing. On a partial-target dispatch the crates-chain jobs
    # skip, an upstream job survives only via its own `!cancelled()`, and GitHub's skipped-state
    # propagation then resumes at the first dependent that declares no opt-out -- skipping it
    # before this `if:` is ever evaluated, with every build leg green. Diagnosed on
    # html-to-markdown runs 33491693123/33494806766/33495781759, fixed there in 98d4537c41.
    # Every need that must have succeeded is already named explicitly below, which is what
    # opting out of propagation requires.
    if: |
      !cancelled() &&
      needs.prepare.outputs.release_homebrew == 'true' &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.publish-homebrew-formula.result == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, bottle_tag: arm64_sequoia, install_brew: false }
          # ~keep The Intel macOS `sequoia` bottle is deliberately absent, not forgotten. From
          # 2026-09-01 Homebrew serves no `openssl@3` bottle for x86_64 macOS -- "We do not provide
          # support for this platform (as-of September 2026, announced August 2025)", after Apple
          # dropped Intel in macOS 27 -- so the bottle cannot build and no change here can fix it.
          # Leaving it in was not merely noise: its failure skipped `Merge Homebrew bottle DSL`,
          # which left the homebrew target unpublished, which made `Finalize release` refuse and
          # revert v1.19.1 to a DRAFT after all nine registries had already received 1.19.1.
          # Re-add only once Homebrew restores Intel bottles for the dependency chain.
          - { os: ubuntu-latest, bottle_tag: x86_64_linux, install_brew: true }
          - { os: ubuntu-24.04-arm, bottle_tag: arm64_linux, install_brew: true }
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Install Homebrew (Linux)
        if: ${{ matrix.install_brew }}
        uses: xberg-io/actions/install-homebrew-linux@v1

      - name: Build bottles
        uses: xberg-io/actions/homebrew-build-bottles@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}
          tap: xberg-io/homebrew-tap
          formulas: |
            liter-llm
          out-dir: ${{ github.workspace }}/bottle-json
          github-repo: xberg-io/liter-llm
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/upload-artifact@v7
        with:
          name: homebrew-bottle-json-${{ matrix.bottle_tag }}
          path: ${{ github.workspace }}/bottle-json/*.json
          if-no-files-found: error
          retention-days: 14

  publish-homebrew-bottles:
    name: Merge Homebrew bottle DSL
    needs: [prepare, validate-versions, publish-homebrew-formula, homebrew-bottles]
    # ~keep `!cancelled()` is load-bearing. On a partial-target dispatch the crates-chain jobs
    # skip, an upstream job survives only via its own `!cancelled()`, and GitHub's skipped-state
    # propagation then resumes at the first dependent that declares no opt-out -- skipping it
    # before this `if:` is ever evaluated, with every build leg green. Diagnosed on
    # html-to-markdown runs 33491693123/33494806766/33495781759, fixed there in 98d4537c41.
    # Every need that must have succeeded is already named explicitly below, which is what
    # opting out of propagation requires.
    # A matrix job reports `failure` when ANY leg fails (fail-fast is off here), so gating the
    # merge on `== 'success'` skipped it whenever one platform's bottle broke -- and skipping
    # the merge leaves the PREVIOUS version's whole `bottle do` block in the tap, root_url
    # included, so every platform's bottle 404s rather than just the one that failed to build.
    # Merge whatever bottles did upload; the merge script itself errors when there are zero
    # manifests, so a total failure is still loud. ~keep
    if: |
      !cancelled() &&
      needs.prepare.outputs.release_homebrew == 'true' &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.validate-versions.result == 'success' &&
      needs.publish-homebrew-formula.result == 'success' &&
      needs.homebrew-bottles.result != 'skipped' &&
      needs.homebrew-bottles.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: tap-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
          repositories: homebrew-tap

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - uses: actions/checkout@v7
        with:
          repository: xberg-io/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: homebrew-tap
          persist-credentials: true

      - uses: actions/download-artifact@v8
        with:
          path: ${{ github.workspace }}/bottle-json
          pattern: homebrew-bottle-json-*
          merge-multiple: true

      - uses: xberg-io/actions/homebrew-merge-bottles@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          version: ${{ needs.prepare.outputs.version }}
          tap-dir: ${{ github.workspace }}/homebrew-tap
          json-dir: ${{ github.workspace }}/bottle-json
          formulas: |
            liter-llm
          github-repo: xberg-io/liter-llm

      - name: Commit and push bottle DSL
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          git config user.name "xberg-dev-publisher[bot]"
          git config user.email "291994444+xberg-dev-publisher[bot]@users.noreply.github.com"
          if git diff --quiet Formula/; then
            echo "No bottle DSL changes; skipping commit."
            exit 0
          fi
          git add Formula/liter-llm.rb
          git commit -m "liter-llm ${{ needs.prepare.outputs.version }}: add bottle DSL"
          # Every repo's publish pipeline pushes to this one shared tap, so a concurrent
          # release can land between our checkout and our push and reject it as non-fast-forward.
          # Each repo touches only its own formulas, so rebasing onto the new tip and retrying is
          # safe -- there is nothing for two releases to genuinely conflict over. ~keep
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the current tap tip"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::tap rebase hit a real conflict; refusing to force the push"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::could not push to the tap after 5 attempts"
          exit 1

  # NOTE: per-channel verify-install jobs are rebuilt in the test_apps plan

  release-finalize:
    name: Finalize release
    needs:
      - prepare
      - validate-versions
      - registry-results
      - crates-gate
      - check-pub
      - check-zig
      - check-homebrew
      - upload-elixir-nifs
      - upload-cli-binaries
      - publish-homebrew-formula
      - upload-c-ffi
      - upload-go-ffi
      - publish-go-module
      - upload-php-extensions
      - publish-crates
      - publish-pypi
      - publish-node
      - publish-wasm
      - publish-rubygems
      - publish-maven
      - publish-kotlin-android-maven
      - publish-hex
      - publish-nuget
      - publish-packagist
      - publish-homebrew-bottles
      - publish-scoop-manifest
      - trigger-pubdev
      - publish-zig
      - upload-swift-release
      - promote-release
      - verify-binstall
    if: always() && (github.event_name != 'release' || github.actor != 'xberg-dev-publisher[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      # Only ever un-draft a release that actually shipped. v1.17.1 finalized green with
      # zero assets and not one registry published, because this step ran unconditionally
      # under the job's `always()`. Skipped targets are fine here; failures are not. ~keep
      # ~keep `contains(needs.*.result, 'failure')` cannot see a SKIPPED job, and `skipped` is
      # exactly what a publish job becomes when an upstream gate fails — a failed `needs:` edge
      # makes GitHub skip the dependent job without evaluating its `if:` at all. So a release
      # where every registry silently shipped nothing finalized green (v1.17.1 here;
      # tree-sitter-language-pack v1.15.5 upstream). Judge every target on its own result and
      # treat `skipped` as a failure unless one of two legitimate reasons applies: the target is
      # not enabled for this release, or its registry probe already found this exact version.
      # This step never exits non-zero itself — it publishes a verdict the finalize step gates on
      # and the hold step fails on, so the summary table below still renders either way.
      - name: Verify every enabled publish target succeeded
        id: verify
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          IS_TAG: ${{ needs.prepare.outputs.is_tag }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          FORCE_REPUBLISH: ${{ needs.prepare.outputs.force_republish }}
          RESULT_PREPARE: ${{ needs.prepare.result }}
          RESULT_VALIDATE: ${{ needs.validate-versions.result }}
          CRATES_GATE_OK: ${{ needs.crates-gate.outputs.ok }}
          CRATES_GATE_OUTCOME: ${{ needs.crates-gate.outputs.outcome }}
          RESULT_PUBLISH_CRATES: ${{ needs.publish-crates.result }}
          RESULT_PUBLISH_PYPI: ${{ needs.publish-pypi.result }}
          RESULT_PUBLISH_NODE: ${{ needs.publish-node.result }}
          RESULT_PUBLISH_WASM: ${{ needs.publish-wasm.result }}
          RESULT_PUBLISH_RUBYGEMS: ${{ needs.publish-rubygems.result }}
          RESULT_PUBLISH_MAVEN: ${{ needs.publish-maven.result }}
          RESULT_PUBLISH_HEX: ${{ needs.publish-hex.result }}
          RESULT_PUBLISH_PACKAGIST: ${{ needs.publish-packagist.result }}
          RESULT_PUBLISH_NUGET: ${{ needs.publish-nuget.result }}
          RESULT_PUBLISH_GO_MODULE: ${{ needs.publish-go-module.result }}
          RESULT_TRIGGER_PUBDEV: ${{ needs.trigger-pubdev.result }}
          RESULT_PUBLISH_ZIG: ${{ needs.publish-zig.result }}
          RESULT_PUBLISH_HOMEBREW: ${{ needs.publish-homebrew-bottles.result }}
          RESULT_PUBLISH_SCOOP: ${{ needs.publish-scoop-manifest.result }}
          RESULT_UPLOAD_CLI: ${{ needs.upload-cli-binaries.result }}
          RESULT_VERIFY_BINSTALL: ${{ needs.verify-binstall.result }}
          RESULT_UPLOAD_C_FFI: ${{ needs.upload-c-ffi.result }}
          RESULT_UPLOAD_GO_FFI: ${{ needs.upload-go-ffi.result }}
          RESULT_UPLOAD_ELIXIR: ${{ needs.upload-elixir-nifs.result }}
          RESULT_UPLOAD_PHP: ${{ needs.upload-php-extensions.result }}
          RESULT_UPLOAD_SWIFT: ${{ needs.upload-swift-release.result }}
          RELEASE_CRATES: ${{ needs.prepare.outputs.release_crates }}
          RELEASE_PYTHON: ${{ needs.prepare.outputs.release_python }}
          RELEASE_NODE: ${{ needs.prepare.outputs.release_node }}
          RELEASE_WASM: ${{ needs.prepare.outputs.release_wasm }}
          RELEASE_RUBY: ${{ needs.prepare.outputs.release_ruby }}
          RELEASE_JAVA: ${{ needs.prepare.outputs.release_java }}
          RELEASE_ELIXIR: ${{ needs.prepare.outputs.release_elixir }}
          RELEASE_PHP: ${{ needs.prepare.outputs.release_php }}
          RELEASE_CSHARP: ${{ needs.prepare.outputs.release_csharp }}
          RELEASE_GO: ${{ needs.prepare.outputs.release_go }}
          RELEASE_DART: ${{ needs.prepare.outputs.release_dart }}
          RELEASE_ZIG: ${{ needs.prepare.outputs.release_zig }}
          RELEASE_SWIFT: ${{ needs.prepare.outputs.release_swift }}
          RELEASE_HOMEBREW: ${{ needs.prepare.outputs.release_homebrew }}
          RELEASE_SCOOP: ${{ needs.prepare.outputs.release_scoop }}
          EXISTS_CRATES: ${{ needs.registry-results.outputs.cratesio }}
          EXISTS_PYPI: ${{ needs.registry-results.outputs.pypi }}
          EXISTS_NPM: ${{ needs.registry-results.outputs.npm }}
          EXISTS_NPM_WASM: ${{ needs.registry-results.outputs.npm_wasm }}
          EXISTS_RUBYGEMS: ${{ needs.registry-results.outputs.rubygems }}
          EXISTS_MAVEN: ${{ needs.registry-results.outputs.maven }}
          EXISTS_HEX: ${{ needs.registry-results.outputs.hex }}
          EXISTS_PACKAGIST: ${{ needs.registry-results.outputs.packagist }}
          EXISTS_NUGET: ${{ needs.registry-results.outputs.nuget }}
          EXISTS_GO: ${{ needs.registry-results.outputs.go }}
          EXISTS_PUB: ${{ needs.check-pub.outputs.exists }}
          EXISTS_ZIG: ${{ needs.check-zig.outputs.exists }}
          EXISTS_HOMEBREW: ${{ needs.check-homebrew.outputs.exists }}
        run: |
          set -uo pipefail
          failed=0

          if [[ "${IS_TAG}" != "true" || "${DRY_RUN}" == "true" ]]; then
            echo "Not a real tag release — nothing to verify."
            echo "ok=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          require_success() {
            local name="$1" result="$2"
            if [[ "${result}" != "success" ]]; then
              echo "::error title=Incomplete release::Required release job '${name}' finished with '${result}' — ${TAG} did not ship."
              failed=1
              return
            fi
            echo "  - ${name}: ok"
          }

          require_publish() {
            local name="$1" result="$2" enabled="$3" already="${4:-}"

            if [[ "${enabled}" != "true" ]]; then
              echo "  - ${name}: not enabled for this release"
              return
            fi
            if [[ "${already}" == "true" && "${FORCE_REPUBLISH}" != "true" ]]; then
              echo "  - ${name}: already published at this version (correctly skipped)"
              return
            fi
            if [[ "${result}" != "success" ]]; then
              echo "::error title=Incomplete release::Publish target '${name}' is enabled and not yet published, but its job finished with '${result}' — refusing to finalize ${TAG}."
              failed=1
              return
            fi
            echo "  - ${name}: published"
          }

          require_success "prepare" "${RESULT_PREPARE}"
          require_success "validate-versions" "${RESULT_VALIDATE}"

          if [[ "${CRATES_GATE_OK}" != "true" ]]; then
            echo "::error title=Incomplete release::crates-gate reported '${CRATES_GATE_OUTCOME}' — the crates.io prerequisite for ${TAG} was never satisfied."
            failed=1
          fi

          require_publish "crates.io" "${RESULT_PUBLISH_CRATES}" "${RELEASE_CRATES}" "${EXISTS_CRATES}"
          require_publish "pypi" "${RESULT_PUBLISH_PYPI}" "${RELEASE_PYTHON}" "${EXISTS_PYPI}"
          require_publish "npm" "${RESULT_PUBLISH_NODE}" "${RELEASE_NODE}" "${EXISTS_NPM}"
          require_publish "npm-wasm" "${RESULT_PUBLISH_WASM}" "${RELEASE_WASM}" "${EXISTS_NPM_WASM}"
          require_publish "rubygems" "${RESULT_PUBLISH_RUBYGEMS}" "${RELEASE_RUBY}" "${EXISTS_RUBYGEMS}"
          require_publish "maven" "${RESULT_PUBLISH_MAVEN}" "${RELEASE_JAVA}" "${EXISTS_MAVEN}"
          require_publish "hex" "${RESULT_PUBLISH_HEX}" "${RELEASE_ELIXIR}" "${EXISTS_HEX}"
          require_publish "packagist" "${RESULT_PUBLISH_PACKAGIST}" "${RELEASE_PHP}" "${EXISTS_PACKAGIST}"
          require_publish "nuget" "${RESULT_PUBLISH_NUGET}" "${RELEASE_CSHARP}" "${EXISTS_NUGET}"
          require_publish "go-module" "${RESULT_PUBLISH_GO_MODULE}" "${RELEASE_GO}" "${EXISTS_GO}"
          require_publish "pub.dev" "${RESULT_TRIGGER_PUBDEV}" "${RELEASE_DART}" "${EXISTS_PUB}"
          require_publish "zig" "${RESULT_PUBLISH_ZIG}" "${RELEASE_ZIG}" "${EXISTS_ZIG}"
          require_publish "homebrew" "${RESULT_PUBLISH_HOMEBREW}" "${RELEASE_HOMEBREW}" "${EXISTS_HOMEBREW}"
          require_publish "scoop" "${RESULT_PUBLISH_SCOOP}" "${RELEASE_SCOOP}"

          # Release assets consumers resolve at install time.
          require_publish "cli-binaries" "${RESULT_UPLOAD_CLI}" "${RELEASE_HOMEBREW}" "${EXISTS_HOMEBREW}"
          require_publish "binstall-verify" "${RESULT_VERIFY_BINSTALL}" "${RELEASE_HOMEBREW}" "${EXISTS_HOMEBREW}"
          # ~keep `upload-c-ffi` has no registry of its own, so it cannot be given an
          # `already` flag directly -- it rides on `build-ffi`, which runs only while at
          # least one of its three consumers (Go, Java/Maven, C#/NuGet) still needs
          # artifacts at this version. Re-run a tag whose consumers are all already
          # published and `build-ffi` skips by design, `upload-c-ffi` skips with it, and
          # passing a bare "true" here read that correct skip as a missed target: it is
          # what re-drafted the complete v1.19.1 release on its second run (job
          # 99983926589). Mirror `build-ffi`'s own condition so the two agree. Force
          # republish is deliberately not repeated here -- `require_publish` already
          # ignores `already` under FORCE_REPUBLISH, matching `build-ffi` running again.
          ffi_already=true
          if [[ "${RELEASE_GO}" == "true" && "${EXISTS_GO}" != "true" ]] ||
             [[ "${RELEASE_JAVA}" == "true" && "${EXISTS_MAVEN}" != "true" ]] ||
             [[ "${RELEASE_CSHARP}" == "true" && "${EXISTS_NUGET}" != "true" ]]; then
            ffi_already=false
          fi
          require_publish "c-ffi-assets" "${RESULT_UPLOAD_C_FFI}" "true" "${ffi_already}"
          require_publish "go-ffi-assets" "${RESULT_UPLOAD_GO_FFI}" "${RELEASE_GO}" "${EXISTS_GO}"
          require_publish "elixir-nif-assets" "${RESULT_UPLOAD_ELIXIR}" "${RELEASE_ELIXIR}" "${EXISTS_HEX}"
          require_publish "php-extension-assets" "${RESULT_UPLOAD_PHP}" "${RELEASE_PHP}" "${EXISTS_PACKAGIST}"
          require_publish "swift-assets" "${RESULT_UPLOAD_SWIFT}" "${RELEASE_SWIFT}"

          if [[ "${failed}" -eq 1 ]]; then
            echo "ok=false" >>"$GITHUB_OUTPUT"
            echo "::error title=Incomplete release::Release ${TAG} did not reach every enabled target — it will not be finalized."
            exit 0
          fi
          echo "ok=true" >>"$GITHUB_OUTPUT"
          echo "Every enabled publish target for ${TAG} succeeded."

      - name: Finalize release
        if: ${{ needs.prepare.outputs.dry_run != 'true' && !contains(needs.*.result, 'failure') && steps.verify.outputs.ok == 'true' }}
        uses: xberg-io/actions/finalize-release@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Publish summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "## Release v${VERSION}"
            echo ""
            echo "| Registry | Status |"
            echo "|----------|--------|"
          } >> "$GITHUB_STEP_SUMMARY"
          report() {
            local name="$1" result="$2"
            case "$result" in
              success)  echo "| $name | ✅ Published |" ;;
              skipped)  echo "| $name | ⏭️ Skipped |" ;;
              *)        echo "| $name | ❌ $result |" ;;
            esac
          }
          {
            report "crates.io"   "${{ needs.publish-crates.result }}"
            report "PyPI"        "${{ needs.publish-pypi.result }}"
            report "npm"         "${{ needs.publish-node.result }}"
            report "npm (WASM)"  "${{ needs.publish-wasm.result }}"
            report "RubyGems"    "${{ needs.publish-rubygems.result }}"
            report "Maven"       "${{ needs.publish-maven.result }}"
            report "Maven (Kotlin Android)" "${{ needs.publish-kotlin-android-maven.result }}"
            report "Hex.pm"      "${{ needs.publish-hex.result }}"
            report "NuGet"       "${{ needs.publish-nuget.result }}"
            report "Packagist"   "${{ needs.publish-packagist.result }}"
            report "pub.dev"     "${{ needs.trigger-pubdev.result }}"
            report "Zig"         "${{ needs.publish-zig.result }}"
            report "Go FFI"      "${{ needs.upload-go-ffi.result }}"
            report "PHP ext"     "${{ needs.upload-php-extensions.result }}"
            report "Homebrew"    "${{ needs.publish-homebrew-bottles.result }}"
            report "Swift"       "${{ needs.upload-swift-release.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      # Runs after the summary table so a failed release still reports which targets
      # shipped, then fails the job so the run cannot be mistaken for a good release.
      # `contains(needs.*.result, 'failure')` alone was not enough: a target that shipped
      # nothing because an upstream gate failed reads as `skipped`, not `failure`, so the
      # verdict from the verify step above is what catches a release that published nothing. ~keep
      # ~keep The step re-drafts rather than only asserting the state, because by the time it
      # runs the release may legitimately already be published: `promote-release` publishes it
      # early so `verify-binstall` has real assets to install from, and a re-run after an
      # earlier green finalize starts from a published release too. Merely echoing left a
      # published release advertising a run that shipped nothing — the v1.19.0 outcome.
      #
      # The retraction is CONDITIONAL. The Homebrew formula and Scoop manifest jobs above may
      # already have pushed to the public tap and bucket, and both pin
      # `.../releases/download/<tag>/...`. Re-drafting after that does not undo a partial
      # release, it 404s every `brew upgrade` and `scoop update` resolving through those
      # channels — crawlberg v1.5.0 sat exactly that way for two days (xberg-io/crawlberg#41).
      # So the action retracts only while no channel advertises the release, and otherwise
      # reports it and leaves it published to be rolled forward. The verdict is never masked:
      # the step below fails the job either way. ~keep
      - name: Hold release as draft
        if: ${{ needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.is_tag == 'true' && (contains(needs.*.result, 'failure') || steps.verify.outputs.ok != 'true') }}
        uses: xberg-io/actions/retract-incomplete-release@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          consumer-results: |
            homebrew-formula=${{ needs.publish-homebrew-formula.result }}
            homebrew-bottles=${{ needs.publish-homebrew-bottles.result }}
            scoop=${{ needs.publish-scoop-manifest.result }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Fail an incomplete release
        if: ${{ needs.prepare.outputs.dry_run != 'true' && (contains(needs.*.result, 'failure') || steps.verify.outputs.ok != 'true') }}
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          echo "::error::${TAG} did not reach every enabled publish target."
          exit 1
        shell: bash

  announce-discord:
    name: Announce release on Discord
    needs:
      - prepare
      - publish-crates
      - publish-pypi
      - publish-node
      - publish-wasm
      - publish-rubygems
      - publish-maven
      - publish-hex
      - publish-nuget
      - publish-packagist
      - publish-homebrew-bottles
      - publish-scoop-manifest
      - upload-c-ffi
      - upload-go-ffi
      - publish-go-module
      - upload-elixir-nifs
      - upload-php-extensions
      - upload-cli-binaries
      - release-finalize
    # ~keep Gated on release-finalize's job result, not on `contains(needs.*.result, 'failure')`.
    # That expression cannot see a SKIPPED job, and `skipped` -- not `failure` -- is exactly what
    # a publish job becomes when an upstream gate fails, so the announcement fired for releases
    # that shipped nothing (the same defect release-finalize documents and fixed for itself at
    # its `Verify every enabled publish target succeeded` step). release-finalize already computes
    # that verdict and fails its `Hold release as draft` step on a bad one, so depending on its
    # result reuses the corrected judgement instead of duplicating the skipped-detection logic
    # here and drifting from it again.
    if: |
      always() &&
      !cancelled() &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.release-finalize.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
      - uses: xberg-io/actions/announce-release-discord@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          project-name: liter-llm
          token: ${{ steps.app-token.outputs.token }}

  cli-proxy:
    name: Publish CLI proxy package (npm)
    needs: [prepare, validate-versions, upload-cli-binaries]
    if: |
      always() &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.prepare.outputs.release_homebrew == 'true' &&
      needs.validate-versions.result == 'success' &&
      needs.upload-cli-binaries.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Stamp release version into cli-proxy package.json
        shell: bash
        run: |
          cd cli-proxy/npm
          npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Re-check npm before publish
        id: recheck
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: npm
          package: "@xberg-io/liter-llm-cli"
          version: ${{ needs.prepare.outputs.version }}
      - name: Resolve npm dist-tag
        id: dist_tag
        uses: ./.github/actions/resolve-npm-dist-tag
        with:
          package: "@xberg-io/liter-llm-cli"
          version: ${{ needs.prepare.outputs.version }}
          requested-tag: ${{ needs.prepare.outputs.npm_tag }}
      - name: Publish CLI proxy package
        if: ${{ steps.recheck.outputs.exists != 'true' }}
        uses: xberg-io/actions/publish-npm@v1
        with:
          package-dir: cli-proxy/npm
          npm-tag: ${{ steps.dist_tag.outputs.tag }}
          access: public
          provenance: "true"
          expected-version: ${{ needs.prepare.outputs.version }}

  # --- Coding-agent plugin (lives in plugin/, generated by ai-rulez; see plugin/README.md) ---
  # Additive best-effort like the language jobs above: intentionally NOT part of
  # finalize-release / announce `needs`, so a plugin hiccup never blocks the core
  # release. Both publish the same content every tagged release (version tracks core), so
  # each guards against an already-published version. No build- or runtime-dependency on
  # the core packages (mcp-launch.sh resolves the CLI at runtime), so they publish in
  # parallel with the core jobs — but they DO depend on validate-versions, which owns the
  # `plugin/.ai-rulez/config.toml [plugin].version == tag` assertion. Without that edge a
  # drifted plugin still ships: v1.19.0 published the npm bundle carrying 1.18.4 manifests
  # (unrecoverable — npm forbids republishing a version) while the Hermes job rebuilt the
  # 1.18.4 wheel, hit publish-pypi's skip-existing guard, and reported success having
  # published nothing for the tag. ~keep

  publish-plugin-opencode:
    name: Publish OpenCode plugin to npm
    needs: [prepare, validate-versions]
    if: >-
      ${{ !cancelled() && needs.prepare.outputs.is_tag == 'true'
      && needs.validate-versions.result == 'success'
      && needs.prepare.outputs.release_node == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
      - name: Upgrade npm (trusted publishing support)
        run: npm install -g npm@latest
      # ~keep validate-versions asserts the plugin *source* pin
      # (plugin/.ai-rulez/config.toml [plugin].version); it says nothing about the rendered
      # bundle this job actually uploads. plugin/package.json is regenerated from that pin by
      # ai-rulez, and its freshness is only enforced by ci-plugin.yaml, which does not gate this
      # workflow. A stale plugin/package.json breaks the guard below both ways: the probe
      # reads the *artifact's* version, so a stale-but-published version sets skip=true and the
      # job goes green having shipped nothing for the tag, while a stale-but-unpublished version
      # is permanently accepted by npm under the resolved dist-tag, i.e. possibly `latest`. That
      # is how v1.19.0 published an npm bundle carrying 1.18.4 manifests. Assert artifact ==
      # release before anything is probed or uploaded.
      - name: Assert the plugin bundle matches the release
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          actual="$(jq -r '.version' plugin/package.json)"
          # ~keep A dry run synthesizes its tag as `<version>-dryrun-<sha>`; the manifests never
          # carry that suffix, so comparing it verbatim fails on a bundle that is in fact
          # correct. Strip it rather than skipping the assertion on dry runs -- a dry run is
          # where a drifted bundle should surface, while nothing has been published.
          expected="${VERSION%%-dryrun-*}"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::plugin/package.json declares ${actual} but the release is ${expected};" \
              "regenerate the plugin bundle (task version:sync) before tagging"
            exit 1
          fi
          echo "plugin/package.json matches the release at ${expected}"
      # Plain ESM adapter — no build step. Skip if this version is already on npm so a
      # release re-run is idempotent (publish-npm has no built-in skip-existing). ~keep
      - name: Skip if already on npm
        id: guard
        run: |
          name="$(node -p "require('./plugin/package.json').name")"
          ver="$(node -p "require('./plugin/package.json').version")"
          if npm view "${name}@${ver}" version >/dev/null 2>&1; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "::notice::${name}@${ver} already on npm; skipping"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi
      - name: Resolve npm dist-tag
        id: dist_tag
        uses: ./.github/actions/resolve-npm-dist-tag
        with:
          package: "@xberg-io/opencode-liter-llm"
          version: ${{ needs.prepare.outputs.version }}
          requested-tag: ${{ needs.prepare.outputs.npm_tag }}
      - uses: xberg-io/actions/publish-npm@v1
        if: steps.guard.outputs.skip != 'true'
        with:
          package-dir: plugin
          access: public
          npm-tag: ${{ steps.dist_tag.outputs.tag }}
          provenance: "true"
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.version }}

  publish-plugin-hermes:
    name: Publish Hermes plugin to PyPI
    needs: [prepare, validate-versions]
    if: >-
      ${{ !cancelled() && needs.prepare.outputs.is_tag == 'true'
      && needs.validate-versions.result == 'success'
      && needs.prepare.outputs.release_python == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"
      # ~keep Same rendered-bundle gap as the npm job, but silent: this job had no guard at
      # all, and publish-pypi's skip-existing is not one — a stale
      # plugin/.hermes/package/pyproject.toml rebuilds an already-published wheel version, gets
      # skipped, and the job reports success having shipped nothing for the tag, which is what
      # v1.19.0 did. ai-rulez renders this manifest in PEP 440 form, so the comparison uses the
      # respelled release version prepare computes (1.9.0-rc.2 -> 1.9.0rc2). An unrecognised
      # spelling fails loudly rather than publishing, which is the safe direction.
      - name: Assert the plugin bundle matches the release
        shell: bash
        run: |
          pyproject="plugin/.hermes/package/pyproject.toml"
          actual="$(awk -F"[\"']" '/^version = /{print $2; exit}' "${pyproject}")"
          expected="${{ needs.prepare.outputs.pypi_version }}"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::${pyproject} declares ${actual} but the release is ${expected};" \
              "regenerate the plugin bundle (task version:sync) before tagging"
            exit 1
          fi
          echo "${pyproject} matches the release at ${expected}"
      - name: Build Hermes wheel
        run: uv build --wheel --out-dir dist-hermes plugin/.hermes/package
      # publish-pypi is idempotent (skips a version already on PyPI). ~keep
      - uses: xberg-io/actions/publish-pypi@v1
        with:
          packages-dir: dist-hermes
          dry-run: ${{ needs.prepare.outputs.dry_run }}
          expected-version: ${{ needs.prepare.outputs.pypi_version }}
