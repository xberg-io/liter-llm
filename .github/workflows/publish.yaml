name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. v1.0.0-rc.1)"
        required: true
        type: string
      ref:
        description: "Git ref (branch, tag, or commit) to build; defaults to the tag"
        required: false
        type: string
      dry_run:
        description: "Dry run — build everything but skip registry publishes"
        required: false
        default: false
        type: boolean
      force_republish:
        description: "Force publish even if the version already exists in registries"
        required: false
        type: boolean
        default: false
      republish:
        description: "Delete and re-create the tag on current HEAD before publishing (retag + full republish)"
        required: false
        type: boolean
        default: false
      targets:
        description: "Comma-separated targets to publish (empty = all). Values: crates python node wasm ruby go java elixir csharp php homebrew"
        required: false
        default: ""
        type: string
  release:
    types: [published]
  repository_dispatch:
    types: [publish-release]

# Keyed on the workflow alone, deliberately not on the tag: registries that resolve a
# "newest" pointer by publish order rather than by version (npm dist-tags, Homebrew
# formula HEAD, GitHub Release assets) are corrupted when two release runs overlap. The
# v1.15.0 run stayed alive for 24h and published `@xberg-io/liter-llm-wasm@1.15.0` three
# hours after the v1.16.0 run had published 1.16.0, leaving `latest` pinned to 1.15.0.
# Releases must therefore run strictly one at a time. ~keep
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare
    # This workflow publishes the release object itself, which re-enters it through
    # `on: release` and queues a full duplicate publish run behind the dispatch run that
    # created it. Keyed on `actor`, not `release.author` and not `triggering_actor`:
    # release.author is always the bot because the bot creates the release as a draft, so it
    # would suppress a human publishing that draft. triggering_actor becomes the human on a
    # re-run, so it would ADMIT a duplicate when someone re-runs the bot's own recursive run.
    # `actor` is pinned to whoever initiated the original run and survives re-runs. ~keep
    if: >-
      github.event_name != 'release' ||
      github.actor != 'xberg-dev-publisher[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      checkout_ref: ${{ steps.meta.outputs.dry_run == 'true' && (inputs.ref || github.ref) || steps.meta.outputs.checkout_ref }}
      version: ${{ steps.meta.outputs.version }}
      # ~keep PyPI and RubyGems respell a semver prerelease, so the release version cannot be
      # handed to their publish guards verbatim. See the step that computes these below.
      pypi_version: ${{ steps.version_forms.outputs.pypi_version }}
      gem_version: ${{ steps.version_forms.outputs.gem_version }}
      is_tag: ${{ steps.meta.outputs.is_tag }}
      npm_tag: ${{ steps.meta.outputs.npm_tag }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      force_republish: ${{ steps.meta.outputs.force_republish }}
      target_sha: ${{ steps.meta.outputs.target_sha }}
      release_crates: ${{ steps.meta.outputs.release_crates }}
      release_python: ${{ steps.meta.outputs.release_python }}
      release_node: ${{ steps.meta.outputs.release_node }}
      release_wasm: ${{ steps.meta.outputs.release_wasm }}
      release_ruby: ${{ steps.meta.outputs.release_ruby }}
      release_go: ${{ steps.meta.outputs.release_go }}
      release_java: ${{ steps.meta.outputs.release_java }}
      release_elixir: ${{ steps.meta.outputs.release_elixir }}
      release_csharp: ${{ steps.meta.outputs.release_csharp }}
      release_php: ${{ steps.meta.outputs.release_php }}
      release_homebrew: ${{ steps.meta.outputs.release_homebrew }}
      release_scoop: ${{ steps.meta.outputs.release_scoop }}
      release_kotlin: ${{ steps.meta.outputs.release_kotlin }}
      release_dart: ${{ steps.meta.outputs.release_dart }}
      release_zig: ${{ steps.meta.outputs.release_zig }}
      release_swift: ${{ steps.meta.outputs.release_swift }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ (inputs.republish == true && (inputs.ref || github.event.repository.default_branch)) || inputs.ref || github.ref }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      # The App token has to go through the action's `token` INPUT, not the caller's `env`.
      # retag-for-republish is a composite action whose own step sets
      # `GH_TOKEN: ${{ inputs.token }}`, and a step-level env in a composite action overrides
      # anything the caller set — so the App token here was silently discarded and the action
      # fell back to its `github.token` default. GITHUB_TOKEN cannot write git refs, which is
      # the HTTP 403 on `POST /git/refs` that made `republish: true` unusable. ~keep
      - name: Retag for republish
        if: ${{ inputs.republish == true || github.event.client_payload.republish == true }}
        uses: xberg-io/actions/retag-for-republish@v1
        with:
          tag: ${{ inputs.tag || github.event.client_payload.tag }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Extract release metadata
        id: meta
        uses: xberg-io/actions/prepare-release-metadata@v1
        with:
          # ~keep A name absent from this list makes its `release_*` flag false, so the matching
          # publish job never runs; a name alef does not recognise hard-errors `prepare` and takes
          # the whole pipeline down. `scoop` is safe on both counts as of alef 0.79.5, which
          # carries it in the known-target list and treats it as implying `cli`.
          available-targets: "crates,python,node,wasm,ruby,go,java,elixir,csharp,php,homebrew,scoop,kotlin,dart,zig,swift"

      # ~keep The publish actions compare `expected-version` against the artifact's own version
      # string, and two ecosystems respell a semver prerelease: PyPI dist filenames carry the
      # PEP 440 form (1.9.0-rc.2 -> 1.9.0rc2) and gem filenames the RubyGems form
      # (1.9.0-rc.2 -> 1.9.0.pre.rc.2). Those are the spellings alef writes into the manifests
      # the artifacts are built from, so the guard has to be handed the same spelling or every
      # prerelease would fail it on a version that is in fact correct. A final release has no
      # suffix and passes through both expressions untouched.
      - name: Respell the release version for PyPI and RubyGems
        id: version_forms
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          pypi="$(printf '%s' "${VERSION}" \
            | sed -E 's/-alpha\.?([0-9]+)$/a\1/; s/-beta\.?([0-9]+)$/b\1/; s/-([A-Za-z]+)\.?([0-9]+)$/\1\2/')"
          gem="$(printf '%s' "${VERSION}" | sed -E 's/^([^-]+)-(.*)$/\1.pre.\2/' | tr '_-' '..')"
          {
            echo "pypi_version=${pypi}"
            echo "gem_version=${gem}"
          } >>"$GITHUB_OUTPUT"

      - name: Ensure GitHub Release exists for tag
        if: ${{ steps.meta.outputs.is_tag == 'true' && steps.meta.outputs.dry_run != 'true' }}
        uses: xberg-io/actions/publish-github-release@v1
        with:
          tag: ${{ steps.meta.outputs.tag }}
          draft: "true"
          dry-run: ${{ steps.meta.outputs.dry_run }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Attach model catalog snapshot to release
        if: ${{ steps.meta.outputs.is_tag == 'true' && steps.meta.outputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          TARGET_SHA: ${{ steps.meta.outputs.target_sha }}
        run: |
          jq \
            --arg commit "$TARGET_SHA" \
            --arg tag "$TAG" \
            '.["$provenance"].generated_by_commit = $commit | .["$provenance"].release_tag = $tag' \
            schemas/catalog.json > /tmp/catalog.json
          gh release upload "$TAG" /tmp/catalog.json --clobber
        shell: bash

  # ~keep Every job that publishes to a registry or uploads a release asset must gate on
  # this job. A `needs:` edge alone is NOT a gate for a job whose `if:` contains `always()`
  # or `!cancelled()` -- those opt out of automatic failure propagation, so the explicit
  # `needs.validate-versions.result == 'success'` term is what actually stops them. Gating
  # transitively through an intermediate job that is itself declared `if: always()` does not
  # work either, for the same reason. v1.19.0 is the worked example: validate-versions failed,
  # the plugin publish jobs carried no edge to it, and npm permanently accepted
  # `@xberg-io/opencode-liter-llm@1.19.0` carrying 1.18.4 manifests -- npm forbids
  # republishing a version, so it is unrecoverable.
  validate-versions:
    name: Validate versions
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Check version consistency
        uses: xberg-io/actions/validate-versions@v1
        with:
          version: ${{ needs.prepare.outputs.version }}
          manifest-paths: |
            cargo=Cargo.toml
            python=packages/python/pyproject.toml
            npm=crates/liter-llm-node/package.json
            gem=packages/ruby/liter_llm.gemspec
            maven=packages/java/pom.xml
            mix=packages/elixir/mix.exs
            csproj=packages/csharp/LiterLlm/LiterLlm.csproj
            composer=composer.json

      # The coding-agent plugin under plugin/ carries its own version source
      # (plugin/.ai-rulez/config.toml [plugin].version) that the shared
      # validate-versions action does not know about. Assert it against the tag
      # actually being released, so a drifted plugin fails the release instead of
      # shipping a bundle that lags the version it claims to be. ~keep
      # ~keep A dry run synthesizes its tag as `<version>-dryrun-<sha>`, so the release
      # version carries a suffix no manifest will ever hold and the assertion below fails
      # on a plugin that is in fact correct. Strip the suffix rather than skipping the step
      # on dry runs -- a dry run is exactly where a drifted plugin should surface, while
      # there is still no tag and nothing has been published.
      - name: Validate plugin version matches the release
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/sync_plugin_version.py --expect "${VERSION%%-dryrun-*}"

  check-registries:
    name: Check registries
    needs: [prepare]
    uses: xberg-io/actions/.github/workflows/reusable-check-registries.yml@v1
    with:
      version: ${{ needs.prepare.outputs.version }}
      registries: >-
        [
          {"name": "cratesio", "registry": "cratesio", "package": "liter-llm"},
          {"name": "pypi", "registry": "pypi", "package": "liter-llm"},
          {"name": "npm", "registry": "npm", "package": "@xberg-io/liter-llm"},
          {"name": "npm-wasm", "registry": "npm", "package": "@xberg-io/liter-llm-wasm"},
          {"name": "rubygems", "registry": "rubygems", "package": "liter_llm"},
          {"name": "maven", "registry": "maven", "package": "io.xberg.literllm:liter-llm"},
          {"name": "hex", "registry": "hex", "package": "liter_llm"},
          {"name": "packagist", "registry": "packagist", "package": "xberg-io/liter-llm"},
          {"name": "nuget", "registry": "nuget", "package": "XbergIo.LiterLlm"},
          {"name": "go", "registry": "github-release", "package": "liter-llm", "repo": "xberg-io/liter-llm", "asset-prefix": "liter-llm-go-v"}
        ]

  registry-results:
    name: Parse registry results
    needs: [prepare, check-registries]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      cratesio: ${{ steps.parse.outputs.cratesio }}
      pypi: ${{ steps.parse.outputs.pypi }}
      npm: ${{ steps.parse.outputs.npm }}
      npm_wasm: ${{ steps.parse.outputs.npm_wasm }}
      rubygems: ${{ steps.parse.outputs.rubygems }}
      maven: ${{ steps.parse.outputs.maven }}
      hex: ${{ steps.parse.outputs.hex }}
      packagist: ${{ steps.parse.outputs.packagist }}
      nuget: ${{ steps.parse.outputs.nuget }}
      go: ${{ steps.parse.outputs.go }}
    steps:
      - name: Parse check results
        id: parse
        env:
          RESULTS: ${{ needs.check-registries.outputs.results }}
        run: |
          if [ -z "$RESULTS" ] || [ "$RESULTS" = "null" ]; then
            for key in cratesio pypi npm npm_wasm rubygems maven hex packagist nuget go; do
              echo "${key}=false" >> "$GITHUB_OUTPUT"
            done
          else
            echo "$RESULTS" | python3 -c "
          import json, sys, os
          data = json.load(sys.stdin)
          out = os.environ.get('GITHUB_OUTPUT', '/dev/stdout')
          with open(out, 'a') as f:
              for key in ['cratesio','pypi','npm','npm_wasm','rubygems','maven','hex','packagist','nuget','go']:
                  # The reusable workflow returns 'result' from the matrix, keyed by check name
                  val = str(data.get(key, data.get(key.replace('_','-'), 'false'))).lower()
                  f.write(f'{key}={val}\n')
          "
          fi
        shell: bash

  check-pub:
    name: Check pub.dev for Dart package
    needs: prepare
    if: ${{ needs.prepare.outputs.release_dart == 'true' && (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: pub
          package: liter_llm
          version: ${{ needs.prepare.outputs.version }}

  build-dart-native:
    name: Build Dart native lib (${{ matrix.label }})
    needs: [prepare, check-pub]
    if: ${{ needs.prepare.outputs.release_dart == 'true' && (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && (needs.check-pub.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            runner: macos-latest
            lib_name: libliter_llm_dart.dylib
            pub_name: libliter_llm_dart.dylib
          - label: linux-x86_64
            runner: ubuntu-latest
            lib_name: libliter_llm_dart.so
            pub_name: libliter_llm_dart_x86_64.so
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            lib_name: libliter_llm_dart.so
            pub_name: libliter_llm_dart_aarch64.so
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: dart-native-${{ matrix.label }}
          use-sccache: false

      - name: Build liter-llm-dart cdylib
        run: cargo build -p liter-llm-dart --release

      - name: Rename lib to publish name
        shell: bash
        run: |
          cp target/release/${{ matrix.lib_name }} ${{ matrix.pub_name }}

      - name: Upload native lib
        uses: actions/upload-artifact@v7
        with:
          name: dart-native-${{ matrix.label }}
          path: ${{ matrix.pub_name }}
          if-no-files-found: error
          retention-days: 7

  assemble-dart-package:
    name: Assemble Dart package artifact
    needs: [prepare, check-pub, build-dart-native]
    if: ${{ needs.prepare.outputs.release_dart == 'true' && (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && (needs.check-pub.outputs.exists != 'true' || needs.prepare.outputs.force_republish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Download macOS arm64 native lib
        uses: actions/download-artifact@v8
        with:
          name: dart-native-macos-arm64
          path: dart-natives

      - name: Download Linux x86_64 native lib
        uses: actions/download-artifact@v8
        with:
          name: dart-native-linux-x86_64
          path: dart-natives

      - name: Download Linux arm64 native lib
        uses: actions/download-artifact@v8
        with:
          name: dart-native-linux-arm64
          path: dart-natives

      - name: Bundle native libs into Dart package
        shell: bash
        run: |
          BRIDGE_DIR="packages/dart/lib/src/liter_llm_bridge_generated"
          ls dart-natives/
          cp dart-natives/libliter_llm_dart.dylib "$BRIDGE_DIR/"
          cp dart-natives/libliter_llm_dart_x86_64.so "$BRIDGE_DIR/"
          cp dart-natives/libliter_llm_dart_aarch64.so "$BRIDGE_DIR/"

      - uses: actions/upload-artifact@v7
        with:
          name: dart-package-assembled
          path: packages/dart
          if-no-files-found: error
          retention-days: 7

  check-zig:
    name: Check Zig package presence
    needs: prepare
    if: ${{ (needs.prepare.outputs.is_tag == 'true' || needs.prepare.outputs.dry_run == 'true') && needs.prepare.outputs.release_zig == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        uses: xberg-io/actions/check-registry@v1
        with:
          registry: github-release
          package: liter-llm-zig-v${{ needs.prepare.outputs.version }}.tar.gz
          version: ${{ needs.prepare.outputs.version }}
          repo: ${{ github.repository }}
          assets: liter-llm-zig-v${{ needs.prepare.outputs.version }}.tar.gz

  build-python-wheels:
    name: Build Python wheels (${{ matrix.label }})
    needs: [prepare, registry-results]
    if: |
      always() &&
      needs.prepare.outputs.release_python == 'true' &&
      (needs.registry-results.outputs.pypi != 'true' || needs.prepare.outputs.force_republish == 'true')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-latest
          - label: linux-aarch64
            runner: ubuntu-24.04-arm
          - label: macos-arm64
            runner: macos-latest
          - label: windows-x86_64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - uses: xberg-io/actions/build-python-wheels@v1
        with:
          package-dir: packages/python
          cibw-build: "cp310-*"
          cibw-skip: "*-musllinux* *-win32 *-manylinux_i686 *-macosx_x86_64"
          cibw-environment: 'MATURIN_BUILD_ARGS="--compatibility linux" CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=cc'
          artifact-name: python-wheel-${{ matrix.label }}

  build-python-sdist:
    name: Build Python sdist
    needs: [prepare, registry-results, crates-gate]
    if: |
      !cancelled() && needs.crates-gate.outputs.ok == 'true' &&
      needs.prepare.outputs.release_python == 'true' &&
      (needs.registry-results.outputs.pypi != 'true' || needs.prepare.outputs.force_republish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - uses: xberg-io/actions/setup-rust@v1
        with:
          use-sccache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: xberg-io/actions/build-python-sdist@v1
        with:
          package-dir: packages/python
          output-dir: dist
          dry-run: ${{ needs.prepare.outputs.dry_run }}
      - uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: dist/*.tar.gz
          retention-days: 14

  build-node-native:
    name: Build Node native (${{ matrix.label }})
    needs: [prepare, registry-results]
    if: |
      always() &&
      needs.prepare.outputs.release_node == 'true' &&
      (needs.registry-results.outputs.npm != 'true' || needs.prepare.outputs.force_republish == 'true')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64-gnu
            runner: ubuntu-latest
            napi_target: x86_64-unknown-linux-gnu
          - label: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            napi_target: aarch64-unknown-linux-gnu
          # ~keep Cross-compiled from the arm64 image on purpose: the Intel
          # runners this used to target are being retired and now queue for
          # hours, wedging the whole release. Apple ships both slices, so
          # x86_64-apple-darwin builds natively here with no extra toolchain.
          - label: darwin-x64
            runner: macos-latest
            napi_target: x86_64-apple-darwin
          - label: darwin-arm64
            runner: macos-latest
            napi_target: aarch64-apple-darwin
          - label: win32-x64-msvc
            runner: windows-latest
            napi_target: x86_64-pc-windows-msvc
          - label: win32-arm64-msvc
            runner: windows-latest
            napi_target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.napi_target }}
          use-sccache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g @napi-rs/cli
        shell: bash
      - name: Build NAPI binding
        run: napi build --release --platform --no-js --dts index.native.d.ts --target ${{ matrix.napi_target }}
        working-directory: crates/liter-llm-node
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: node-native-${{ matrix.label }}
          path: crates/liter-llm-node/*.node
          retention-days: 14

  build-wasm:
    name: Build WASM
    needs: [prepare, registry-results]
    if: |
      always() &&
      needs.prepare.outputs.release_wasm == 'true' &&
      (needs.registry-results.outputs.npm_wasm != 'true' || needs.prepare.outputs.force_republish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: wasm32-unknown-unknown
          use-sccache: false
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
        shell: bash
      - name: Build WASM package
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: wasm-pack build --target web --release
        working-directory: crates/liter-llm-wasm
        shell: bash
      - name: Patch pkg/package.json
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 - <<'EOF'
          import json, os
          path = "crates/liter-llm-wasm/pkg/package.json"
          with open(path) as f:
            pkg = json.load(f)
          pkg["name"] = "@xberg-io/liter-llm-wasm"
          pkg["version"] = os.environ["VERSION"]
          pkg["publishConfig"] = {"registry": "https://registry.npmjs.org/", "access": "public"}
          with open(path, "w") as f:
            json.dump(pkg, f, indent=2)
          EOF
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-pkg
          path: crates/liter-llm-wasm/pkg/
          retention-days: 14

  build-ruby-gem:
    name: Build Ruby gem (${{ matrix.label }})
    needs: [prepare, registry-results, crates-gate]
    if: |
      !cancelled() && needs.crates-gate.outputs.ok == 'true' &&
      needs.prepare.outputs.release_ruby == 'true' &&
      (needs.registry-results.outputs.rubygems != 'true' || needs.prepare.outputs.force_republish == 'true')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-latest
            ruby_platform: x86_64-linux
          - label: linux-aarch64
            runner: ubuntu-24.04-arm
            ruby_platform: aarch64-linux
          - label: macos-arm64
            runner: macos-latest
            ruby_platform: arm64-darwin
    env:
      RB_SYS_CARGO_PROFILE: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: publish-ruby-${{ matrix.label }}
          use-sccache: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: none
          bundler-cache: false

      - name: Install Bundler
        shell: bash
        run: (gem install bundler -v 4.0.0 --no-document || gem install bundler --no-document) && bundler --version

      - name: Install Task
        uses: xberg-io/actions/install-task@v1

      - name: Rewrite native dependencies to registry versions
        if: needs.prepare.outputs.dry_run != 'true'
        uses: xberg-io/actions/rewrite-native-deps@v1
        with:
          lang: ruby

      - name: Build FFI library
        run: cargo build -p liter-llm-ffi --release
        shell: bash

      - name: Install Ruby dependencies
        shell: bash
        working-directory: packages/ruby
        run: |
          bundle config set --local path vendor/bundle
          bundle check || bundle install

      - name: Compile native extension
        shell: bash
        working-directory: packages/ruby
        timeout-minutes: 60
        run: |
          echo "Compiling native extension..."
          if ! bundle exec rake compile 2>&1 | tee compile.log; then
            echo "ERROR: Rake compile failed with exit code ${PIPESTATUS[0]}" >&2
            exit 1
          fi
          echo "Native extension compiled successfully"
          echo "=== Native libraries ==="
          find lib -name '*.so' -o -name '*.bundle' -o -name '*.dylib' 2>/dev/null | head -20

      - name: Build platform gem
        shell: bash
        working-directory: packages/ruby
        run: ruby ../../scripts/publish/ruby/build-native-gem.rb "${{ matrix.ruby_platform }}"

      - name: Verify platform gem was built
        shell: bash
        working-directory: packages/ruby
        run: |
          if [ ! -d pkg ]; then
            echo "ERROR: pkg directory does not exist" >&2
            ls -la >&2
            exit 1
          fi
          if ! find pkg -maxdepth 1 -name "liter_llm-*-${{ matrix.ruby_platform }}.gem" -print -quit | grep -q .; then
            echo "ERROR: No platform gem for ${{ matrix.ruby_platform }} found in pkg/" >&2
            ls -la pkg/ >&2
            exit 1
          fi
          echo "Platform gem built successfully:"
          ls -lh pkg/*.gem

      - uses: actions/upload-artifact@v7
        with:
          name: rubygems-${{ matrix.label }}
          path: packages/ruby/pkg/*.gem
          retention-days: 14
          compression-level: 0

  build-elixir-nifs:
    name: Build Elixir NIFs (${{ matrix.label }})
    needs: [prepare, registry-results, crates-gate]
    if: |
      !cancelled() && needs.crates-gate.outputs.ok == 'true' &&
      needs.prepare.outputs.release_elixir == 'true' &&
      (needs.registry-results.outputs.hex != 'true' || needs.prepare.outputs.force_republish == 'true')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib_ext: so
          - label: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            lib_ext: so
          - label: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            lib_ext: dylib
          - label: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-gnu
            lib_ext: dll
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}
          use-sccache: false
      - name: Rewrite native dependencies to registry versions
        if: needs.prepare.outputs.dry_run != 'true'
        uses: xberg-io/actions/rewrite-native-deps@v1
        with:
          lang: elixir
      - name: Build Rustler NIF
        run: >
          cargo build --release
          --target ${{ matrix.target }}
          --manifest-path packages/elixir/native/liter_llm_nif/Cargo.toml
        shell: bash
      - name: Create NIF tarballs (nif-2.16 and nif-2.17)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          LIB_EXT: ${{ matrix.lib_ext }}
        run: |
          # liter_llm_nif is excluded from the root workspace and has no own
          # [workspace] declaration, so cargo writes its build output under
          # packages/elixir/native/liter_llm_nif/target/, not repo-root/target/.
          NIF_TARGET_DIR="packages/elixir/native/liter_llm_nif/target"
          if [ "$LIB_EXT" = "dll" ]; then
            LIB_SRC="${NIF_TARGET_DIR}/${TARGET}/release/liter_llm_nif.${LIB_EXT}"
          else
            LIB_SRC="${NIF_TARGET_DIR}/${TARGET}/release/libliter_llm_nif.${LIB_EXT}"
          fi
          # rustler_precompiled 0.9.0 hardcodes `.so` for every non-Windows target
          # in `lib_name_with_ext/2`. Normalize darwin output to `.so` so the
          # release asset name matches what `generate-elixir-checksums` and
          # consumer `mix deps.get` look up. Windows stays `.dll`.
          case "$LIB_EXT" in
            dylib) PUBLISH_EXT="so" ;;
            *)     PUBLISH_EXT="$LIB_EXT" ;;
          esac
          mkdir -p nif-tarballs
          for NIF_VER in 2.16 2.17; do
            TARBALL="nif-tarballs/libliter_llm_nif-v${VERSION}-nif-${NIF_VER}-${TARGET}.${PUBLISH_EXT}.tar.gz"
            INNER="libliter_llm_nif-v${VERSION}-nif-${NIF_VER}-${TARGET}.${PUBLISH_EXT}"
            cp "$LIB_SRC" "$INNER"
            tar -czf "$TARBALL" "$INNER"
            rm "$INNER"
            echo "Created: $TARBALL"
          done
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: elixir-nifs-${{ matrix.label }}
          path: nif-tarballs/*.tar.gz
          retention-days: 14

  build-php:
    name: Build PHP PIE binary (php${{ matrix.php }} ${{ matrix.platform.label }})
    needs: [prepare, crates-gate]
    if: |
      !cancelled() && needs.crates-gate.outputs.ok == 'true' &&
      needs.prepare.outputs.release_php == 'true'
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        platform:
          - os: ubuntu-latest
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            label: linux-arm64
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            label: macos-arm64
            target: aarch64-apple-darwin
          - os: windows-latest
            label: windows-x86_64
            target: x86_64-pc-windows-msvc
        exclude:
          - php: "8.5"
            platform:
              os: macos-latest
              label: macos-arm64
              target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Ensure target commit
        if: ${{ needs.prepare.outputs.target_sha != '' }}
        env:
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: scripts/publish/common/ensure-target-commit.sh
        shell: bash

      - name: Setup PHP
        uses: xberg-io/actions/setup-php@v1
        with:
          php-version: ${{ matrix.php }}

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: publish-php-${{ matrix.platform.label }}-php${{ matrix.php }}
          toolchain: stable
          use-sccache: false

      - name: Install alef
        uses: xberg-io/actions/install-alef@v1

      - name: Build PHP extension
        uses: xberg-io/actions/build-php-extension@v1
        with:
          crate-name: liter-llm-php
          lib-name: liter_llm_php
          php-version: ${{ matrix.php }}
          php-ts: nts
          dry-run: ${{ needs.prepare.outputs.dry_run }}

      - name: Determine Windows compiler
        if: runner.os == 'Windows'
        id: wincompiler
        shell: pwsh
        run: |
          $compiler = switch ('${{ matrix.php }}') {
            '8.2' { 'vs16' }
            '8.3' { 'vs16' }
            '8.4' { 'vs17' }
            '8.5' { 'vs17' }
            default { 'vs17' }
          }
          "compiler=$compiler" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Package PIE archive
        uses: xberg-io/actions/package-php-pie@v1
        with:
          php-version: ${{ matrix.php }}
          php-ts: nts
          target: ${{ matrix.platform.target }}
          windows-compiler: ${{ steps.wincompiler.outputs.compiler }}
          version: ${{ needs.prepare.outputs.version }}
          output-dir: dist/php-package
          dry-run: ${{ needs.prepare.outputs.dry_run }}

      - name: Upload PHP PIE package artifact
        if: needs.prepare.outputs.dry_run != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: php-package-${{ matrix.platform.label }}-php${{ matrix.php }}
          path: |
            dist/php-package/php_*.tgz
            dist/php-package/php_*.tgz.sha256
            dist/php-package/php_*.zip
            dist/php-package/php_*.zip.sha256
          retention-days: 14

  build-ffi:
    name: Build Rust FFI (${{ matrix.label }})
    needs: [prepare, validate-versions, registry-results]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      needs.validate-versions.result == 'success' &&
      (
        (needs.prepare.outputs.release_go == 'true' &&
         (needs.registry-results.outputs.go != 'true' || needs.prepare.outputs.force_republish == 'true')) ||
        (needs.prepare.outputs.release_java == 'true' &&
         (needs.registry-results.outputs.maven != 'true' || needs.prepare.outputs.force_republish == 'true')) ||
        (needs.prepare.outputs.release_csharp == 'true' &&
         (needs.registry-results.outputs.nuget != 'true' || needs.prepare.outputs.force_republish == 'true'))
      )
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rid: linux-x64
          - label: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rid: linux-arm64
          - label: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            rid: osx-arm64
          # ~keep Cross-compiled from the arm64 image on purpose, mirroring
          # build-node-native: Intel macOS runners queue for hours, and Apple
          # ships both slices so x86_64-apple-darwin builds natively here with
          # no extra toolchain. Without this leg, packages/go/.lib/ never gets
          # a macos-x86_64 dir even though binding.go's cgo LDFLAGS reference
          # it, and the LiterLlm.csproj RuntimeIdentifiers/runtime.json.template
          # both declare osx-x64 support that was never actually built.
          - label: macos-x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
            rid: osx-x64
          - label: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            rid: win-x64
          # ~keep Cross-compiled from the x64 image on purpose: GitHub has no
          # win-arm64 hosted runner, but MSVC's ARM64 cross-linker ships on
          # windows-latest and build-node-native already proves this triple
          # links cleanly here (win32-arm64-msvc napi target, same runner).
          # Without this leg, LiterLlm.csproj's RuntimeIdentifiers and
          # runtime.json.template both declare win-arm64 support that is
          # never actually built.
          - label: windows-arm64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            rid: win-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          target: ${{ matrix.target }}
          use-sccache: false
      - name: Install alef
        uses: xberg-io/actions/install-alef@v1
      - name: Build FFI
        shell: bash
        run: alef publish build --lang ffi --target ${{ matrix.target }}
      - name: Package Go FFI
        shell: bash
        run: alef publish package --lang go --target ${{ matrix.target }} -o go-ffi-dist
      - name: Stage FFI artifacts
        env:
          TARGET: ${{ matrix.target }}
          RID: ${{ matrix.rid }}
        run: |
          mkdir -p "ffi-staging/${RID}"
          find "target/${TARGET}/release" -maxdepth 1 -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' -o -name '*.a' -o -name '*.dll.lib' \) -name '*liter_llm_ffi*' -exec cp {} "ffi-staging/${RID}/" \;
          # Stage the canonical cbindgen-generated C header. build.rs writes
          # it to include/liter_llm.h; fail hard rather than silently falling
          # back to a stale top-level header (which previously shipped an
          # out-of-date ABI to the zig package and broke @cImport).
          mkdir -p ffi-staging/include
          if [ -f crates/liter-llm-ffi/include/liter_llm.h ]; then
            cp crates/liter-llm-ffi/include/liter_llm.h ffi-staging/include/
          else
            echo "ERROR: cbindgen header crates/liter-llm-ffi/include/liter_llm.h missing" >&2
            exit 1
          fi
        shell: bash
      - name: Package C FFI tarball
        env:
          TARGET: ${{ matrix.target }}
          LABEL: ${{ matrix.label }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          declare -A triple_map=(
            ["linux-x86_64"]="x86_64-unknown-linux-gnu"
            ["linux-aarch64"]="aarch64-unknown-linux-gnu"
            ["macos-arm64"]="aarch64-apple-darwin"
            ["macos-x86_64"]="x86_64-apple-darwin"
            ["windows-x86_64"]="x86_64-pc-windows-msvc"
            ["windows-arm64"]="aarch64-pc-windows-msvc"
          )
          TRIPLE="${triple_map[$LABEL]}"
          STAGE_DIR="liter_llm_ffi-v${VERSION}-${TRIPLE}"
          mkdir -p "$STAGE_DIR/lib" "$STAGE_DIR/include"
          find "target/${TARGET}/release" -maxdepth 1 -type f \
            \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' -o -name '*.dll.lib' \) \
            -name '*liter_llm_ffi*' \
            -exec cp {} "$STAGE_DIR/lib/" \;
          if [ -f crates/liter-llm-ffi/include/liter_llm.h ]; then
            cp crates/liter-llm-ffi/include/liter_llm.h "$STAGE_DIR/include/"
          else
            echo "ERROR: cbindgen header crates/liter-llm-ffi/include/liter_llm.h missing" >&2
            exit 1
          fi
          mkdir -p dist/c-ffi
          tar -czf "dist/c-ffi/${STAGE_DIR}.tar.gz" "$STAGE_DIR"
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: ffi-${{ matrix.label }}
          path: ffi-staging/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: c-ffi-${{ matrix.label }}
          path: dist/c-ffi/*.tar.gz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: go-ffi-${{ matrix.label }}
          path: go-ffi-dist/
          retention-days: 14

  build-java-package:
    name: Build Java package
    needs: [prepare, registry-results, build-ffi]
    if: |
      always() &&
      needs.prepare.outputs.release_java == 'true' &&
      needs.build-ffi.result == 'success' &&
      (needs.registry-results.outputs.maven != 'true' || needs.prepare.outputs.force_republish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - uses: actions/download-artifact@v8
        with:
          pattern: ffi-*
          path: ffi-artifacts
          merge-multiple: true
      - name: Stage native libs for Java
        run: |
          # Map runtime IDs (RID) to Java native directory structure.
          # FFI build uses osx/win prefixes (compatibility with Go/.NET);
          # Java NativeLib resolver expects macos/windows prefixes.
          declare -A rid_map=(
            [linux-x64]="linux-x64"
            [linux-arm64]="linux-arm64"
            [osx-arm64]="macos-arm64"
            [win-x64]="windows-x64"
          )
          for ffi_rid in "${!rid_map[@]}"; do
            java_rid="${rid_map[$ffi_rid]}"
            dest="packages/java/src/main/resources/natives/${java_rid}"
            mkdir -p "$dest"
            find "ffi-artifacts/${ffi_rid}" -type f -print0 | xargs -0 -I{} cp {} "$dest/"
          done
        shell: bash
      - uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
      - name: Setup Maven 3.9.11
        uses: xberg-io/actions/setup-maven@v1
      - name: Build Maven package
        run: mvn clean package -DskipTests -q
        working-directory: packages/java
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: maven-packages
          path: packages/java/target/*.jar
          retention-days: 14

  build-csharp-package:
    name: Build C# NuGet package
    needs: [prepare, registry-results, build-ffi]
    if: |
      always() &&
      needs.prepare.outputs.release_csharp == 'true' &&
      needs.build-ffi.result == 'success' &&
      (needs.registry-results.outputs.nuget != 'true' || needs.prepare.outputs.force_republish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CSHARP_RIDS is declared once at job scope and consumed by both the staging
    # loop and the per-RID pack loop. Keeping a single list is what stops the two
    # from drifting into "natives staged for a RID that never gets packed".
    env:
      CSHARP_RIDS: linux-x64 linux-arm64 osx-arm64 osx-x64 win-x64 win-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - uses: actions/download-artifact@v8
        with:
          pattern: ffi-*
          path: ffi-artifacts
          merge-multiple: true
      - name: Stage native libs for C#
        run: |
          for rid in ${CSHARP_RIDS}; do
            dest="packages/csharp/LiterLlm/runtimes/${rid}/native"
            mkdir -p "$dest"
            find "ffi-artifacts/${rid}" -type f -print0 | xargs -0 -I{} cp {} "$dest/"
          done
        shell: bash
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Render runtime.json from template
        uses: xberg-io/actions/render-runtime-json@v1
        with:
          template-path: packages/csharp/LiterLlm/runtime.json.template
          version: ${{ needs.prepare.outputs.version }}
      - name: Pack NuGet package
        run: dotnet pack packages/csharp/LiterLlm/LiterLlm.csproj -c Release -o nuget-output
        shell: bash
      # The meta package ships no natives; its runtime.json RID-fallback graph
      # resolves XbergIo.LiterLlm.runtime.<rid> instead. Without this loop those
      # packages are never built, so every RID in the graph points at something
      # that does not exist on nuget.org and the binding cannot load anywhere.
      - name: Pack per-RID native runtime packages
        run: |
          for rid in ${CSHARP_RIDS}; do
            dotnet pack packages/csharp/LiterLlm.Runtime/LiterLlm.Runtime.csproj \
              -c Release -o nuget-output -p:PublishedRID="${rid}"
          done
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: nuget-output/*.nupkg
          retention-days: 14

  build-kotlin-android-natives:
    name: Build Kotlin Android natives (${{ matrix.abi }})
    needs: [prepare, registry-results]
    if: |
      always() &&
      needs.prepare.outputs.release_kotlin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: publish-android-${{ matrix.abi }}
          use-sccache: false
      - uses: xberg-io/actions/setup-android-ndk@v1
      - name: Build liter-llm-jni for ${{ matrix.abi }}
        run: cargo ndk --target ${{ matrix.abi }} --platform 21 -- build -p liter-llm-jni --release
      - name: Stage jniLibs
        shell: bash
        run: |
          mkdir -p packages/kotlin-android/src/main/jniLibs/${{ matrix.abi }}
          case "${{ matrix.abi }}" in
            arm64-v8a) RUST_TGT=aarch64-linux-android ;;
            x86_64)    RUST_TGT=x86_64-linux-android ;;
          esac
          cp "target/${RUST_TGT}/release/libliterllm_jni.so" \
             "packages/kotlin-android/src/main/jniLibs/${{ matrix.abi }}/"
          # Each matrix job builds only its own ABI, but every ABI directory's
          # .gitkeep is checked into git, so the sibling ABI's directory also
          # exists after checkout with no .so in it. Drop it so
          # validateJniLibsForRelease only checks the ABI staged in this job.
          for abi_dir in packages/kotlin-android/src/main/jniLibs/*/; do
            [ "$(basename "$abi_dir")" = "${{ matrix.abi }}" ] || rm -rf "$abi_dir"
          done
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "wrapper"
      - name: Assemble Android library aar
        working-directory: packages/kotlin-android
        env:
          PROJECT_VERSION: ${{ needs.prepare.outputs.version }}
        run: gradle "assembleRelease" "-Pversion=${PROJECT_VERSION}"
      - name: Suffix AAR with ABI to avoid download collision
        shell: bash
        working-directory: packages/kotlin-android
        run: |
          # gradle assembleRelease always emits the same basename
          # (liter-llm-android-release.aar) regardless of ABI. The publish
          # job downloads both matrix artifacts with merge-multiple: true,
          # which flattens them into one directory — identical basenames
          # then collide on the same path and tear the zip ("bad zipfile
          # offset"). Suffix with the ABI so the two AARs stay distinct.
          src=$(ls build/outputs/aar/*.aar)
          mv "$src" "build/outputs/aar/liter-llm-android-${{ matrix.abi }}.aar"
      - uses: actions/upload-artifact@v7
        with:
          name: kotlin-android-${{ matrix.abi }}
          path: packages/kotlin-android/build/outputs/aar/liter-llm-android-${{ matrix.abi }}.aar
          retention-days: 14

  upload-c-ffi:
    name: Upload C FFI assets
    needs: [prepare, validate-versions, build-ffi]
    if: |
      always() &&
      needs.build-ffi.result == 'success' &&
      needs.validate-versions.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: xberg-io
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Ensure GitHub release exists
        uses: xberg-io/actions/publish-github-release@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
