name: CI Plugin

# Freshness gate for the coding-agent plugin (lives in plugin/, generated by ai-rulez).
# Verifies the generated per-runtime bundles match plugin/.ai-rulez (BLAKE3 provenance)
# and that the plugin version tracks the core Cargo.toml version. Regenerate locally with
# `mise run plugin:generate`; re-sync the version with `mise run version:sync`.

on:
  push:
    branches: [main]
    paths:
      - "plugin/**"
      - "skills/**"
      - "scripts/sync_public_skills.py"
      - "scripts/tests/test_public_skills.py"
      - "scripts/tests/test_mcp_launcher_cwd.py"
      - ".claude-plugin/**"
      - ".agents/plugins/**"
      - ".ai-rulez/config*.toml"
      - "Cargo.toml"
      - "scripts/sync_plugin_version.py"
      - "scripts/verify_pi_package.py"
      - "package.json"
      - "mise.toml"
      - "mise.lock"
      - "mise-tasks/**"
      - "scripts/tests/**"
      # Every script under scripts/ has a Bats suite, so a script edit runs the suites. ~keep
      - "scripts/**/*.sh"
      - "test_apps/homebrew/**"
      - "alef.toml"
      - ".github/workflows/ci-plugin.yaml"
  pull_request:
    branches: [main]
    paths:
      - "plugin/**"
      - "skills/**"
      - "scripts/sync_public_skills.py"
      - "scripts/tests/test_public_skills.py"
      - "scripts/tests/test_mcp_launcher_cwd.py"
      - ".claude-plugin/**"
      - ".agents/plugins/**"
      - ".ai-rulez/config*.toml"
      - "Cargo.toml"
      - "scripts/sync_plugin_version.py"
      - "scripts/verify_pi_package.py"
      - "package.json"
      - "mise.toml"
      - "mise.lock"
      - "mise-tasks/**"
      - "scripts/tests/**"
      # Every script under scripts/ has a Bats suite, so a script edit runs the suites. ~keep
      - "scripts/**/*.sh"
      - "test_apps/homebrew/**"
      - "alef.toml"
      - ".github/workflows/ci-plugin.yaml"
  workflow_dispatch:

concurrency:
  group: ci-plugin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin-freshness:
    name: Plugin bundle freshness
    if: github.repository == 'xberg-io/liter-llm' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@v7
      - name: Install uv, Node.js and pnpm
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: uv node pnpm
      # Plugin version must track the core crate version (mise run version:sync keeps it pinned).
      - name: Verify plugin version tracks core
        run: python3 scripts/sync_plugin_version.py --check
      # Byte-verify the ai-rulez-generated bundles under plugin/ match plugin/.ai-rulez.
      # ai-rulez is the latest release; a release that changes bundle bytes turns this red
      # until `mise run plugin:generate` is rerun. ~keep
      - name: Install ai-rulez
        uses: xberg-io/actions/setup-ai-rulez@v1
        with:
          ai-rulez-version: "latest"
      - name: Verify generated plugin bundles are current
        run: |
          ai-rulez verify --plugin
      - name: Verify OpenCode tools and packed Pi resources
        run: |
          node --test scripts/tests/opencode-plugin.test.mjs
          python3 scripts/verify_pi_package.py

      - name: Validate Hermes distribution metadata
        shell: bash
        run: |
          wheel_dir=$(mktemp -d)
          [ -n "$wheel_dir" ] && [ -d "$wheel_dir" ]
          uv build --wheel --out-dir "$wheel_dir" plugin/.hermes/package
          wheels=("$wheel_dir"/*.whl)
          [ "${#wheels[@]}" -eq 1 ] && [ -f "${wheels[0]}" ]
          uvx --from twine==7.0.0 --with packaging==26.3 twine check --strict "${wheels[0]}"
      # ~keep Hermes supports Python 3.11, which mise does not install; this step alone lets uv
      # fetch that managed interpreter so the contract runs on the oldest supported version.
      - name: Verify Hermes discovery and tool calls
        env:
          UV_PYTHON_PREFERENCE: managed
        run: uv run --no-project --python 3.11 --with mcp==1.28.1 --with PyYAML==6.0.3 python scripts/tests/test_hermes_plugin.py

  launcher-contract:
    name: Launcher contract on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both, because the launcher probes the host for npx, uvx and brew and resolves a
        # platform triple from `uname`. A Linux-only job would never execute the macOS arm of
        # either decision. ~keep
        os: [ubuntu-latest, macos-26]
    steps:
      - uses: actions/checkout@v7

      # bats comes at the exact version mise.toml pins; the tasks below run through mise. ~keep
      - name: Install Bats
        uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: bats

      - name: Run the launcher contract tests
        uses: xberg-io/actions/run-bats@v1
        with:
          path: scripts/tests/bats
          lib-path: scripts/tests/lib
          args: |-
            --recursive
            --print-output-on-failure

      - name: Verify the vendored Bats helper library
        if: runner.os == 'Linux'
        run: mise run test:scripts:lib:check

      - name: Verify public skills and export ownership
        run: |
          python3 scripts/tests/test_public_skills.py
          python3 scripts/sync_public_skills.py --check

      - name: Verify actual npm launcher working directory
        run: python3 scripts/tests/test_mcp_launcher_cwd.py
