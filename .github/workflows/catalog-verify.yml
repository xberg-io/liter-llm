name: Catalog Verify

# ~keep No push:/pull_request: triggers: `--validate` re-fetches
# ~keep https://models.dev/api.json live, so it is not hermetic — an upstream
# ~keep edit between commit time and CI time makes an unchanged PR/push go
# ~keep red (see run 31160997087 vs the identical, passing 31154572055).
# ~keep `sync-catalog.yml` already runs this same check on a schedule and
# ~keep opens a PR on genuine drift, so coverage is not lost; this workflow
# ~keep stays available for manual re-verification via workflow_dispatch.
on:
  workflow_dispatch:

concurrency:
  group: catalog-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify catalog freshness
    if: github.repository == 'xberg-io/liter-llm' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # ~keep rust is a mise lock gap (rustup script install); rust-toolchain.toml pins it.
      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: catalog-verify

      - name: Setup mise
        uses: xberg-io/actions/setup-mise@v1
        with:
          install: "false"

      - name: Check catalog is up-to-date with models.dev
        run: mise run generate:catalog:check
        shell: bash
