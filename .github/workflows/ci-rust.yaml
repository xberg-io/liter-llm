name: CI Rust

# ~keep The path filters must name every file this workflow's gates READ, not just the
# sources they compile. A gate is blind to any change that does not match the filter:
# `deny.toml` is the dependency scan's entire policy, `alef.toml` is what
# `alef verify` compares against, and `rust-toolchain.toml` / `.cargo/config.toml`
# decide which compiler and flags every step above runs with. Editing any of them used
# to start no run at all, so the gate they configure could not disagree with them.
# Still unlisted, deliberately: `fixtures/**`, `packages/**`, `e2e/**`, `test_apps/**`
# are also `alef verify` inputs/outputs, but adding them would start this 60-minute
# matrix on every generated-file edit -- ci-e2e.yaml covers those paths instead.
on:
  push:
    branches: [main]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rustfmt.toml
      - rust-toolchain.toml
      - .cargo/**
      - deny.toml
      - alef.toml
      - .task/**
      - Taskfile.yml
      - .github/workflows/ci-rust.yaml
  pull_request:
    branches: [main]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rustfmt.toml
      - rust-toolchain.toml
      - .cargo/**
      - deny.toml
      - alef.toml
      - .task/**
      - Taskfile.yml
      - .github/workflows/ci-rust.yaml
  workflow_dispatch:

concurrency:
  group: ci-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: short
  BUILD_PROFILE: ci
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    if: github.repository == 'xberg-io/liter-llm' && github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
          - os: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: xberg-io/actions/free-disk-space-linux@v1
        with:
          show-initial: "false"
          show-final: "true"

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: rust-${{ matrix.os }}
          use-sccache: "true"
          components: rustfmt, clippy, llvm-tools-preview

      # ~keep setup-rust installs protobuf-compiler without recommended packages on Linux. The
      # etcd-client build needs the well-known .proto files supplied by libprotobuf-dev.
      - name: Install protobuf includes (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libprotobuf-dev

      - name: Setup PHP (required by ext-php-rs build script)
        uses: xberg-io/actions/setup-php@v1

      - name: Install Task
        uses: xberg-io/actions/install-task@v1

      - name: Run Rust tests
        run: task rust:test
        shell: bash

      - name: Run clippy (Linux only)
        if: runner.os == 'Linux'
        run: task rust:lint:check
        shell: bash

      - name: Check Rust formatting (Linux only)
        if: runner.os == 'Linux'
        run: task rust:format:check
        shell: bash

      - name: Install alef (Linux only)
        if: runner.os == 'Linux'
        uses: xberg-io/actions/install-alef@v1

      # ~keep This gate catches generated files drifting from alef.toml. `--exit-code` is no
      # longer required -- it is a hidden, deprecated no-op that alef discards, and verification
      # fails by default -- but it is kept so this step still fails on an older pinned alef.
      - name: Verify binding freshness (Linux only)
        if: runner.os == 'Linux'
        run: alef verify --exit-code
        shell: bash

      # deny.toml already carried an advisories allowlist but nothing in CI ever ran
      # cargo-deny against it, so dependency vulnerabilities went unnoticed. The
      # allowlist documents each tolerated advisory and why it can't be fixed locally;
      # any new advisory fails this step. ~keep
      # ~keep cargo-deny is installed as a native binary rather than run through the upstream
      # cargo-deny Docker action, which failed for two independent reasons -- so re-adding it
      # on an x86 runner would not help. First: the runner pre-builds a container action's
      # image at job start, but the "Free disk space" step above prunes Docker images, so by
      # the time this step ran the image was gone ("Unable to find image '20b7cf:...' locally"
      # -> "pull access denied for 20b7cf"; run 33306733197). Second: that action's Dockerfile
      # unconditionally downloads the x86_64-unknown-linux-musl cargo-deny tarball, which
      # cannot execute on this ubuntu-24.04-arm leg even when the image survives.
      # taiki-e/install-action fetches at step time (nothing left to prune) and its cargo-deny
      # manifest carries an aarch64_linux_musl entry. The flags below reproduce the action
      # defaults that were in effect (--all-features, log-level warn, manifest-path
      # ./Cargo.toml) so the scan semantics are unchanged.
      - name: Install cargo-deny (Linux only)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-deny

      - name: Dependency scan (cargo-deny, Linux only)
        if: runner.os == 'Linux'
        run: >-
          cargo deny --all-features --log-level warn --manifest-path ./Cargo.toml
          check advisories bans licenses sources
        shell: bash

      - name: Install cargo-llvm-cov (Linux only)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust coverage (Linux only)
        if: runner.os == 'Linux'
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
        shell: bash

      - name: Upload coverage (Linux only)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14
