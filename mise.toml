# Versions follow the xberg-io/toolchains baseline named in toolchains.toml. Rust is pinned by
# rust-toolchain.toml, and alef by alef_version in alef.toml, not here. ~keep
[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "windows-x64"]

[tools]
python = "3.13.18"
uv = "0.13.6"
node = "26.12.1"
pnpm = "12.11.2"
go = "1.27.3"
java = "temurin-25.0.5+8.0.LTS"
maven = "3.10.0"
ruby = "3.4.12"
zig = "0.17.0"
"github:Goldziher/poly" = "0.31.2"
"github:Goldziher/ai-rulez" = "5.9.2"
cargo-deny = "0.20.2"
"github:taiki-e/cargo-llvm-cov" = "0.9.1"
"github:bnjbvr/cargo-machete" = "0.9.2"
"github:rustwasm/wasm-pack" = "0.15.0"
gh = "2.103.3"
jq = "1.8.2"
actionlint = "1.7.12"
bats = "1.14.0"
lychee = "0.24.2"

[task_config]
includes = [
  "mise-tasks",
  "mise-tasks/languages.toml",
  "mise-tasks/version.toml",
  "mise-tasks/plugin.toml",
  "mise-tasks/test-apps.toml",
]

[vars]
# Immutable xberg-io/actions tag that the vendored Bats helper library comes from. Raise it,
# then run `mise run test:scripts:lib:sync`; CI runs `mise run test:scripts:lib:check`. ~keep
bats_lib_ref = "v1.29.0"

# ---- Shared task bodies ------------------------------------------------------------------------
# Repository-neutral scripts from xberg-io/toolchains at the toolchains.toml baseline; version.toml
# references the alef ones. ~keep

[tasks."governance:hooks:install"]
description = "Provision machine preferences and install reviewed AI governance hooks"
file = "https://raw.githubusercontent.com/xberg-io/toolchains/v1.5.1/tasks/governance/hooks-install.sh"

[tasks.deps]
description = "Update or upgrade one ecosystem's dependencies, or every ecosystem"
hide = true
file = "https://raw.githubusercontent.com/xberg-io/toolchains/v1.5.1/tasks/deps/refresh.sh"
env.DEPS_LANGS = "rust"
env.DEPS_RUST_MANIFESTS = "e2e/rust/Cargo.toml"

# ---- Entry points ------------------------------------------------------------------------------

[tasks.default]
description = "Show available tasks"
run = "mise tasks ls"

[tasks.setup]
description = "Install all dependencies and dev tools"
run = ["mise install", { task = "rust:install" }, "alef setup", { task = "governance:hooks:install" }]

# Kept by name for existing callers: mise pins the JDK and Maven that .sdkmanrc used to select. ~keep
[tasks."setup:sdkman"]
description = "Install the pinned JDK and Maven (formerly via sdkman)"
run = "mise install java maven"

[tasks.ai-rulez]
description = "Generate ai-rulez configuration files (CLAUDE.md, etc.)"
run = [{ task = "tools:ai-rulez" }]

[tasks."tools:ai-rulez"]
description = "Generate ai-rulez configuration files (CLAUDE.md, etc.)"
run = "ai-rulez generate"

[tasks.build]
description = "Build core Rust library"
run = [{ task = "rust:build" }]

[tasks."build:all"]
description = "Build core libraries and ALL language bindings"
run = [
  { task = "rust:build" },
  { task = "python:build" },
  # ~keep node:build runs `pnpm install` across the workspace, and e2e/wasm
  # depends on `file:../../crates/liter-llm-wasm/pkg/nodejs`. Only the nodejs
  # target emits that directory, so it must exist before pnpm resolves.
  { task = "wasm:build:node" },
  { task = "node:build" },
  { task = "go:build" },
  { task = "java:build" },
  { task = "csharp:build" },
  { task = "php:build" },
  # ~keep `setup` does not install per-language deps, so on a pristine tree
  # `mix compile` fails with every Hex dependency unavailable.
  { task = "elixir:deps" },
  { task = "elixir:build" },
  { task = "ruby:build" },
  { task = "wasm:build" },
]

[tasks."build:release"]
description = "Build in release mode (optimized)"
run = [{ task = "rust:build:release" }]

[tasks.test]
description = "Run Rust unit and FFI tests"
run = [{ task = "rust:test" }]

[tasks."test:all"]
description = "Run ALL test suites across all languages"
run = [
  { task = "rust:test" },
  { task = "go:test" },
  { task = "java:test" },
  { task = "csharp:test" },
  { task = "elixir:test" },
  { task = "test:scripts" },
]

[tasks."test:release-regressions"]
description = "Run lightweight release guard regression tests"
run = ["python3 scripts/ci/check_consumer_versions.py", """\
  uv run --locked --only-group dev --python 3.14 python -m pytest -q \
  scripts/ci/test_task_lint_coverage.py \
  scripts/ci/test_kotlin_consumer_version.py \
  scripts/ci/test_dart_consumer_version.py \
  scripts/ci/test_consumer_versions.py \
  scripts/ci/test_go_release_assets.py \
  scripts/ci/test_release_artifact_versions.py \
  scripts/ci/test_swift_task_environment.py \
  scripts/ci/test_homebrew_consumer_version.py \
  scripts/ci/test_node_public_outputs.py \
  scripts/ci/test_go_smoke_test_filter.py \
  scripts/ci/test_php_smoke.py \
  scripts/ci/test_python_wheel_check.py \
  scripts/ci/test_python_wheel_release_path.py \
  scripts/ci/test_schema_copies.py \
  scripts/ci/test_changelog_entry.py \
  scripts/ci/test_ai_rulez_version.py"""]

[tasks."test:scripts:lib:sync"]
description = "Refresh the vendored Bats helper library from xberg-io/actions"
env.BATS_LIB_REF = "{{vars.bats_lib_ref}}"
run = "scripts/task/sync-bats-lib.sh sync"

[tasks."test:scripts:lib:check"]
description = "Fail when the vendored Bats helper library has drifted from its pinned source"
env.BATS_LIB_REF = "{{vars.bats_lib_ref}}"
run = "scripts/task/sync-bats-lib.sh --check"

[tasks."test:e2e"]
description = "Generate and run e2e tests across all bindings (alias for e2e:verify:all)"
run = [{ task = "e2e:verify:all" }]

[tasks."ci:release-version-forms"]
description = "Resolve canonical package version forms for release validation"
run = "python3 scripts/ci/release_artifact_versions.py"

[tasks."ci:prepare-go-release-assets"]
description = "Prepare version-checked Go installer aliases and checksums"
run = 'python3 scripts/ci/prepare_go_release_assets.py go-ffi-release liter-llm "$RELEASE_VERSION"'

[tasks.lint]
description = "Run all linters via poly"
run = ["poly lint .", { task = "lint:task-coverage" }]

# poly skips files it cannot parse. That is correct, but a NEW silently-skipped task file is
# indistinguishable from one that was checked and found clean. The script reads poly's
# `--format json` report and asserts each skip's reason per file, so poly parsing more of the
# tree is a pass and only a new kind of skip fails. ~keep
[tasks."lint:task-coverage"]
description = "Assert poly surveys every mise task file and skips none of them"
run = "python3 scripts/ci/check_task_lint_coverage.py"

[tasks.check]
description = "Run all checks (lint + test)"
run = [{ task = "lint" }, { task = "test" }]

[tasks.format]
description = "Format all code"
run = "poly fmt --fix ."

[tasks.update]
description = "Update all dependencies within current major versions"
run = [
  "echo 'Updating dependencies (within-major)...'",
  "alef update",
  "gau --update .",
  { task = "generate:catalog" },
  "echo 'All dependencies updated'",
]

[tasks.upgrade]
description = "Upgrade all dependencies to latest versions (may cross major versions)"
run = [
  "echo 'Upgrading dependencies (latest)...'",
  "alef update --latest",
  "gau --update .",
  { task = "generate:catalog" },
  "echo 'All dependencies upgraded'",
]

[tasks.clean]
description = "Clean all build artifacts"
run = [{ task = "rust:clean" }, "alef clean"]

# ---- Proxy and local LLM -----------------------------------------------------------------------

[tasks."proxy:test"]
description = "Run all proxy tests (unit + integration)"
run = "cargo test -p liter-llm-proxy"

[tasks."proxy:docker:build"]
description = "Build proxy Docker image for testing"
run = "docker build -f docker/Dockerfile -t liter-llm:test ."

[tasks."proxy:docker:test"]
description = "Run Docker integration tests locally"
depends = ["proxy:docker:build"]
run = "python3 scripts/ci/docker/test_docker.py --image liter-llm:test --port 14000"

[tasks."local:down"]
description = "Stop local LLM infrastructure"
run = "docker compose -f docker/docker-compose.local-llm.yml down -v"

[tasks."local:test"]
description = "Run local LLM integration tests (requires Ollama running)"
env.OLLAMA_BASE_URL = "http://localhost:11434"
run = "cargo test -p liter-llm --test local_llm -- --ignored --test-threads=1"

# ---- Governance --------------------------------------------------------------------------------

[tasks."governance:check"]
description = "Check materialized local governance outputs against shared sources"
run = ["python3 scripts/ci/check_ai_rulez_version.py workflows", "ai-rulez generate --check --no-local --strict-config"]

# ---- Publishing --------------------------------------------------------------------------------

[tasks."publish:validate"]
description = "Validate publish manifests are consistent"
run = "alef publish validate"

[tasks."publish:prepare"]
description = "Prepare packages for publishing (vendor deps, stage FFI)"
run = "alef publish prepare"

[tasks."publish:build"]
description = "Build release artifacts for all languages"
run = "alef publish build"

[tasks."publish:package"]
description = "Package built artifacts into distributable archives"
run = "alef publish package -o dist/"

# ---- alef and generators -----------------------------------------------------------------------

[tasks."alef:extract"]
description = "Extract API surface from Rust source"
run = "alef extract"

[tasks."alef:generate"]
description = "Fast regeneration of all alef-managed files (bindings, stubs, scaffolding, READMEs, e2e, test_apps, docs). Runs `alef all --clean` (formatting is always applied)."
# ~keep `alef all` never builds the per-language artifacts that a `compile`/`typecheck`
# `docs.snippets.validation_level` needs (only `alef build` does), so leaving validation on
# spawns a doomed toolchain per snippet and cannot pass by construction. Discovery, the
# reference-page audit and gap detection still run. Use `mise run alef:snippets` after
# `alef build` when you actually want validation.
run = "alef all --clean --skip-compile --skip-snippet-validation"

[tasks."alef:all"]
description = "Run full alef pipeline (extract + generate + stubs + scaffold + readme + docs + e2e)"
run = "alef all"

[tasks."alef:verify"]
description = "Check bindings are up-to-date (CI)"
run = "alef verify --exit-code"

[tasks."alef:snippets"]
description = "Validate documentation snippets (needs built artifacts; run after alef build)"
run = [
  "mvn -B -q -f packages/java/pom.xml -DincludeScope=runtime dependency:copy-dependencies",
  { task = "alef:snippets:kotlin:prepare" },
  "alef snippets check",
]

[tasks."alef:snippets:kotlin:prepare"]
description = "Build Android classes required by Kotlin snippet typechecking"
dir = "packages/kotlin-android"
env.GRADLE_USER_HOME = ".gradle"
run = "./gradlew assembleDebug --no-daemon --max-workers=1"

[tasks."generate:all"]
description = "Regenerate all generated code"
run = "alef all"

[tasks."generate:docs"]
description = "Generate API reference documentation"
run = "alef docs"

[tasks."generate:docs:check"]
description = "Validate API reference docs are up-to-date (CI)"
run = "alef verify --exit-code"

[tasks."generate:readme"]
description = "Generate package READMEs"
run = "alef readme"

[tasks."generate:readme:check"]
description = "Validate package READMEs are up-to-date (CI)"
run = "alef verify --exit-code"

[tasks."generate:providers-doc"]
description = "Generate providers documentation from schemas/providers.json"
run = "uv run --no-sync python scripts/generate_providers_doc.py"

[tasks."generate:providers-doc:check"]
description = "Validate providers documentation is up-to-date (CI)"
run = "uv run --no-sync python scripts/generate_providers_doc.py --validate"

[tasks."generate:catalog"]
description = "Refresh schemas/catalog.json from models.dev (also runs as part of `mise run update`/`upgrade`)"
run = "cargo run -p liter-llm-catalog-gen --release --"

[tasks."generate:catalog:check"]
description = "Validate catalog.json is up-to-date with models.dev (CI)"
run = "cargo run -p liter-llm-catalog-gen --release -- --validate"

# ---- E2E ---------------------------------------------------------------------------------------

[tasks."e2e:generate"]
description = "Generate E2E tests for all languages from fixtures (alias for e2e:generate:all)"
run = [{ task = "e2e:generate:all" }]

[tasks."e2e:test"]
description = "Run E2E tests for all languages (alias for e2e:test:all)"
run = [{ task = "e2e:test:all" }]

[tasks."e2e:test:rust"]
description = "Run Rust E2E tests (alias for rust:e2e:test)"
run = [{ task = "rust:e2e:test" }]

[tasks."e2e:mock-server:build"]
description = "Build the standalone e2e mock HTTP server binary (used by non-Rust suites)"
run = "cargo build --manifest-path e2e/rust/Cargo.toml --bin mock-server --release"

[tasks."e2e:generate:all"]
description = "Generate all E2E tests from fixtures across all supported languages"
run = "alef e2e generate"

[tasks."e2e:test:all"]
description = "Run all E2E tests across all supported languages"
run = "alef test --e2e"

[tasks."e2e:test:quick"]
description = "Quick E2E test (Rust only — fastest feedback)"
run = "alef test --lang rust --e2e"

[tasks."e2e:lint:all"]
description = "Lint generated bindings using Alef-configured lint commands"
run = "alef lint"

[tasks."e2e:verify:all"]
description = "Full E2E pipeline — generate, lint, and test all suites"
run = [{ task = "e2e:generate:all" }, { task = "e2e:lint:all" }, { task = "e2e:test:all" }]

# ---- Docs --------------------------------------------------------------------------------------

[tasks."docs:build"]
description = "Build documentation"
run = ["pnpm --dir docs-site install --frozen-lockfile", "pnpm --dir docs-site build"]

[tasks."docs:build:strict"]
description = "Build documentation (CI-equivalent; astro build fails on errors)"
run = [{ task = "docs:build" }]

[tasks."docs:serve"]
description = "Serve documentation locally with live reload"
run = ["pnpm --dir docs-site install", "pnpm --dir docs-site dev"]

[tasks."docs:lint:links"]
description = "Check links with lychee"
run = [
  { task = "docs:build" },
  'lychee --offline --config .lychee.toml --root-dir "$PWD/docs-site/dist" docs-site/dist README.md',
]

[tasks."docs:lint:prose"]
description = "Lint prose with textlint"
run = ["pnpm --dir docs-site install --frozen-lockfile", """\
  docs-site/node_modules/.bin/textlint --rules-base-directory "$PWD/docs-site/node_modules" \
  'docs-site/src/content/docs/**/*.{md,mdx}'"""]

[tasks."docs:lint:prose:test"]
description = "Verify real prose rules reject Markdown and MDX defects"
run = "python3 scripts/ci/check_prose_gate.py"

[tasks."docs:snippets:list"]
description = "List all documentation snippets discovered by alef"
run = "alef snippets list --snippets docs-site/src/snippets"

[tasks."docs:snippets:list:lang"]
description = "List snippets filtered to specific languages (e.g. rust,python)"
usage = 'arg "<languages>" env="LANGUAGES" help="Comma-separated snippet languages"'
run = 'alef snippets list --snippets docs-site/src/snippets --languages "$usage_languages"'

# These two are the validation-only slice of `snippets:all`: `check` without the
# audit and gaps passes, for fast iteration. They used to call `alef snippets
# validate`, which no longer exists — `alef snippets` has only list, check, parse,
# audit and gaps. The old `--level` flag has no replacement: the validation level is
# config-owned (`validation_level = "typecheck"` in alef.toml), so per-language runs
# now typecheck rather than defaulting to syntax. ~keep
[tasks."docs:snippets:validate"]
description = "Validate all snippet entries via alef (configured validation level)"
run = "alef snippets check --strict"

[tasks."docs:snippets:validate:lang"]
description = "Validate snippets for specific languages (e.g. rust,python)"
usage = 'arg "<languages>" env="LANGUAGES" help="Comma-separated snippet languages"'
run = 'alef snippets check --strict --lang "$usage_languages"'

[tasks."docs:snippets:gaps"]
description = "Report unreferenced snippets + missing language variants"
run = "alef snippets gaps --snippets docs-site/src/snippets --docs docs-site/src/content/docs"

[tasks."docs:snippets:audit"]
description = "Audit snippet structure under docs-site/src/snippets"
run = "alef snippets audit --snippets docs-site/src/snippets"

# `check` is the validation gate: it reads alef.toml, so it honours
# validation_level, strict, and the sessions blocks. `validate` does not —
# it takes CLI flags only, defaults to syntax, and runs with an empty
# session map, so it validates weaker than this repo is configured for.
#
# `check` does NOT subsume audit and gaps, despite its --help claiming
# "discovery, validation, audit, and gap checks": run_check calls
# discover_snippets, run_validation and missing_generated_snippets, and
# never audit() or detect_gaps(). Verified against alef 3871e437f. So
# structural audit, orphaned snippets, missing language variants and broken
# MDX import targets still need their own commands. ~keep
[tasks."docs:snippets:all"]
description = "Audit + gaps + configured validation (canonical docs:snippets gate)"
run = [{ task = "docs:snippets:audit" }, { task = "docs:snippets:gaps" }, { task = "docs:snippets:validate" }]
