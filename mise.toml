# Versions follow the xberg-io/toolchains baseline named in toolchains.toml. Rust is pinned by
# rust-toolchain.toml, and alef by alef_version in alef.toml, not here. ~keep
[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "windows-x64"]

[tools]
python = "3.13.18"
uv = "0.13.6"
node = "26.12.1"
pnpm = "12.11.2"
go = "1.27.3"
java = "temurin-25.0.5+8.0.LTS"
maven = "3.10.0"
ruby = "3.4.12"
zig = "0.17.0"
"github:Goldziher/poly" = "0.31.2"
"github:Goldziher/adrlint" = "0.4.0"
cargo-deny = "0.20.2"
"github:taiki-e/cargo-llvm-cov" = "0.9.1"
"github:bnjbvr/cargo-machete" = "0.9.2"
"github:rustwasm/wasm-pack" = "0.15.0"
gh = "2.103.3"
jq = "1.8.2"
actionlint = "1.7.12"
bats = "1.14.0"
lychee = "0.24.2"

[task_config]
includes = [
  "mise-tasks/shared.toml",
  "mise-tasks",
  "mise-tasks/languages.toml",
  "mise-tasks/version.toml",
  "mise-tasks/plugin.toml",
]

[env]
# Immutable xberg-io/actions tag that the vendored Bats helper library comes from. Raise it,
# then run `mise run test:scripts:lib:sync`; CI runs `mise run test:scripts:lib:check`. ~keep
BATS_LIB_REF = "v1.29.0"
# `mise run deps` refreshes only the Rust manifests outside the Cargo workspace. ~keep
DEPS_LANGS = "rust"
DEPS_RUST_MANIFESTS = "e2e/rust/Cargo.toml"

# ---- Entry points ------------------------------------------------------------------------------

[tasks.default]
description = "Show available tasks"
run = "mise tasks ls"

[tasks.setup]
description = "Install all dependencies and dev tools"
run = ["mise install", { task = "rust:install" }, "alef setup", { task = "governance:hooks:install" }]

[tasks.build]
description = "Build core Rust library"
run = [{ task = "rust:build" }]

[tasks.test]
description = "Run Rust unit and FFI tests"
run = [{ task = "rust:test" }]

[tasks."test:release-regressions"]
description = "Run lightweight release guard regression tests"
run = ["python3 scripts/ci/check_consumer_versions.py", """\
  uv run --locked --only-group dev --python 3.14 python -m pytest -q \
  scripts/ci/test_task_lint_coverage.py \
  scripts/ci/test_kotlin_consumer_version.py \
  scripts/ci/test_dart_consumer_version.py \
  scripts/ci/test_consumer_versions.py \
  scripts/ci/test_go_release_assets.py \
  scripts/ci/test_release_artifact_versions.py \
  scripts/ci/test_swift_task_environment.py \
  scripts/ci/test_homebrew_consumer_version.py \
  scripts/ci/test_node_public_outputs.py \
  scripts/ci/test_go_smoke_test_filter.py \
  scripts/ci/test_php_smoke.py \
  scripts/ci/test_python_wheel_check.py \
  scripts/ci/test_python_wheel_release_path.py \
  scripts/ci/test_schema_copies.py \
  scripts/ci/test_changelog_entry.py \
  scripts/ci/test_ai_rulez_version.py"""]

[tasks."ci:release-version-forms"]
description = "Resolve canonical package version forms for release validation"
run = "python3 scripts/ci/release_artifact_versions.py"

[tasks."ci:prepare-go-release-assets"]
description = "Prepare version-checked Go installer aliases and checksums"
run = 'python3 scripts/ci/prepare_go_release_assets.py go-ffi-release liter-llm "$RELEASE_VERSION"'

[tasks.lint]
description = "Run all linters via poly"
run = ["poly lint .", { task = "lint:task-coverage" }]

# poly skips files it cannot parse. That is correct, but a NEW silently-skipped task file is
# indistinguishable from one that was checked and found clean. The script reads poly's
# `--format json` report and asserts each skip's reason per file, so poly parsing more of the
# tree is a pass and only a new kind of skip fails. ~keep
[tasks."lint:task-coverage"]
description = "Assert poly surveys every mise task file and skips none of them"
run = "python3 scripts/ci/check_task_lint_coverage.py"

[tasks.check]
description = "Run all checks (lint + test)"
run = [{ task = "lint" }, { task = "test" }]

[tasks.format]
description = "Format all code"
run = "poly fmt --fix ."

[tasks.update]
description = "Update all dependencies within current major versions"
run = [
  "echo 'Updating dependencies (within-major)...'",
  "alef update",
  "gau --update .",
  { task = "generate:catalog" },
  "echo 'All dependencies updated'",
]

[tasks.upgrade]
description = "Upgrade all dependencies to latest versions (may cross major versions)"
run = [
  "echo 'Upgrading dependencies (latest)...'",
  "alef update --latest",
  "gau --update .",
  { task = "generate:catalog" },
  "echo 'All dependencies upgraded'",
]

[tasks.clean]
description = "Clean all build artifacts"
run = [{ task = "rust:clean" }, "alef clean"]

# ---- alef and generators -----------------------------------------------------------------------

[tasks."alef:snippets"]
description = "Validate documentation snippets (needs built artifacts; run after alef build)"
run = [
  "mvn -B -q -f packages/java/pom.xml -DincludeScope=runtime dependency:copy-dependencies",
  { task = "alef:snippets:kotlin:prepare" },
  "alef snippets check",
]

[tasks."alef:snippets:kotlin:prepare"]
description = "Build Android classes required by Kotlin snippet typechecking"
dir = "packages/kotlin-android"
env.GRADLE_USER_HOME = ".gradle"
run = "./gradlew assembleDebug --no-daemon --max-workers=1"

[tasks."generate:catalog"]
description = "Refresh schemas/catalog.json from models.dev (also runs as part of `mise run update`/`upgrade`)"
run = "cargo run -p liter-llm-catalog-gen --release --"

[tasks."generate:catalog:check"]
description = "Validate catalog.json is up-to-date with models.dev (CI)"
run = "cargo run -p liter-llm-catalog-gen --release -- --validate"
